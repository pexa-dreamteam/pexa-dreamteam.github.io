<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEXA Dream Team</title>
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22305a">
<meta name="apple-mobile-web-app-title" content="PEXA">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Courier+Prime:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--tinta:#2b2620;--crema:#f6efe0;--crema2:#fbf8f1;--linea:#d9cdb4;--piluso:#22305a;--piluso2:#2e3f73;--oro:#e2bd57;--oro2:#b8862b;--rojo:#b8323a;--gol:#3f6aa6;--suerte:#4d7a3a;--picardia:#d9a61c;--fans:#d4692a;--sponsors:#b23f3c;--agua:#8fc3df;--d:"Bowlby One SC",Impact,sans-serif;--m:"Courier Prime",monospace;--t:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--piluso);color:var(--tinta);font-family:var(--t);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--tinta);cursor:pointer;touch-action:manipulation}
input{color:var(--tinta);-webkit-text-fill-color:var(--tinta);opacity:1}
input::placeholder{color:#7b7262;-webkit-text-fill-color:#7b7262}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;overflow-x:clip;background:var(--crema);display:flex;flex-direction:column}
.bt{display:block;width:100%;min-height:46px;padding:10px 14px;border:2px solid var(--tinta);border-radius:8px;background:var(--crema2);font-weight:700;text-align:center}
.bt.fuerte{background:var(--piluso);color:var(--crema);border-color:var(--piluso);font-family:var(--d);font-weight:400;letter-spacing:.03em}
.bt.oro{background:var(--oro);font-family:var(--d);font-weight:400}
.bt.chico{min-height:40px;padding:6px 10px;font-size:14.5px}
.fila{display:flex;gap:8px;align-items:stretch}.fila>*{flex:1;min-width:0}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0}
.barra{background:var(--piluso);color:var(--crema);padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:9}
.reloj{flex:none;font:400 18px var(--d);padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.14);min-width:62px;text-align:center;white-space:nowrap}
.reloj[hidden]{display:none}
.reloj.urgente{background:var(--rojo);color:#fff;animation:relojLatido 1s ease-in-out infinite}
.reloj.pausa{font-size:13px;background:rgba(226,189,87,.28);color:#ffe9a8}
@keyframes relojLatido{50%{transform:scale(1.1)}}
.barra .cono{flex:none}
.barra-dt{background:var(--dtc);color:var(--dtt);border-bottom:2px solid rgba(0,0,0,.35);transition:background .4s}
.barra-cono{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--crema);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.barra .q{flex:1;min-width:0;line-height:1.2}
.barra .q b{display:block;font-family:var(--d);font-weight:400;font-size:17px}
.barra .q span{font-size:13.5px;opacity:.9}
.dados{display:flex;gap:5px;flex:none}
.dd{display:block;flex:none}
.mesa{display:flex;background:var(--agua);align-items:stretch}
#tablero{display:block;flex:1;min-width:0;width:100%;height:auto;background:var(--agua);touch-action:manipulation}
.hist{flex:none;width:46px;padding:6px 3px 6px 0;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.hist-t{font-family:var(--d);font-size:10.5px;text-align:center;color:var(--piluso)}
.ht{display:flex;gap:1px;justify-content:center;background:rgba(251,248,241,.62);border-radius:5px;border-left:4px solid transparent;padding:3px 1px;box-shadow:0 0 0 1px rgba(43,38,32,.35)}
.ht.ult{background:#fbf8f1;box-shadow:0 0 0 2px var(--tinta)}
.ht.vacio{height:25px;background:rgba(251,248,241,.25);box-shadow:none;border-left:0}
.activa{fill:#fff3a0;stroke:#ffd83a;stroke-width:5;stroke-linejoin:round;animation:brillo 3.2s ease-out forwards}
@keyframes brillo{0%{opacity:0}6%{opacity:.85}20%{opacity:.5}34%{opacity:.85}48%{opacity:.5}62%{opacity:.8}100%{opacity:0}}
.tiro{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:14px;z-index:45;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.rueda{animation:rueda .75s cubic-bezier(.2,.8,.3,1)}
.rueda.r2{animation-duration:.9s}
@keyframes rueda{0%{transform:translateY(-70px) rotate(-420deg) scale(.5)}70%{transform:translateY(6px) rotate(12deg) scale(1.08)}100%{transform:none}}
.trueque{position:fixed;left:50%;top:128px;transform:translateX(-50%);width:min(92vw,470px);background:rgba(34,48,90,.96);color:var(--crema);border:3px solid var(--oro);border-radius:14px;padding:10px 12px 14px;z-index:45;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.45);animation:aparece 2.1s ease both}
.trueque h3{text-align:center;font-size:20px;color:var(--oro);margin-bottom:6px}
.tq-fila{display:flex;align-items:center;gap:6px}
.tq-dt{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tq-dt b{font:400 12px/1.05 var(--d);overflow-wrap:anywhere}
.tq-banco{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--oro);color:var(--tinta);font:400 22px var(--d);border:2px solid var(--crema)}
.tq-mesa{position:relative;flex:1;min-width:0;height:136px}
.tq-c{position:absolute;width:40px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}.tq-c svg{display:block;width:100%;height:auto}
.tq-c.ida{top:0;animation:tqIda 1.15s ease-in-out both}
.tq-c.vuelta{bottom:0;animation:tqVuelta 1.15s ease-in-out both}
@keyframes tqIda{0%{left:0;transform:rotate(-14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:calc(100% - 40px);transform:rotate(8deg);opacity:1}}
@keyframes tqVuelta{0%{left:calc(100% - 40px);transform:rotate(14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:0;transform:rotate(-8deg);opacity:1}}
@keyframes aparece{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
.fichaje{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,20,30,.72);z-index:45;pointer-events:none;perspective:900px;animation:aparece 2.8s ease both;padding:16px;text-align:center}
.fj-tit{color:var(--crema)}.fj-tit b{display:block;font:400 22px/1.1 var(--d);color:var(--oro)}.fj-tit span{font-size:14.5px}
.fj-gira{position:relative;width:min(230px,58vw);aspect-ratio:41/63;transform-style:preserve-3d;animation:fjGira 1.15s cubic-bezier(.2,.75,.3,1) both}
.fj-cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.fj-cara svg{display:block;width:100%;height:100%}
.fj-dorso{transform:rotateY(180deg)}
@keyframes fjGira{0%{transform:translateY(60px) rotateY(540deg) scale(.45)}100%{transform:none}}
.fichaje.corto{animation-duration:1.9s;background:rgba(20,20,30,.5)}
.fichaje.corto .fj-gira{width:min(170px,44vw);animation-duration:.85s}
.fichaje.corto .fj-tit b{font-size:19px}
.fj-pone{position:relative;width:min(180px,48vw);animation:fjPone .45s cubic-bezier(.2,1.5,.4,1) both}.fj-pone>svg{display:block;width:100%;height:auto}
@keyframes fjPone{0%{transform:scale(.3) rotate(-10deg)}100%{transform:none}}
.sello{position:absolute;left:50%;top:44%;font:400 25px var(--d);font-style:normal;color:var(--rojo);background:rgba(251,248,241,.9);border:4px solid var(--rojo);border-radius:8px;padding:2px 10px;white-space:nowrap;transform:translate(-50%,-50%) rotate(-14deg);animation:sello .4s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes sello{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.6)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.cj-mesa{position:relative;width:min(320px,86vw);height:180px}
.cj-c{position:absolute;left:50%;top:30px;width:56px;margin-left:-28px;animation:cjEntra .95s ease-in both}.cj-c svg{display:block;width:100%;height:auto}
.cj-solo{--x:-120px;animation-duration:.7s}
@keyframes cjEntra{0%{transform:translateX(var(--x,0)) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(0,12px) scale(.3) rotate(160deg);opacity:0}}
.cj-tk{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;animation:cjSale .5s .85s cubic-bezier(.2,1.6,.4,1) both}.cj-tk svg{display:block;width:100%;height:100%}
@keyframes cjSale{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.cj-mu{position:absolute;left:50%;top:50%;margin:-65px 0 0 -65px;display:block;width:130px;height:130px}.cj-mu svg{display:block}
.mundial{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 28%,#3a5499,#22305a 55%,#141c38);color:var(--crema);overflow:auto;text-align:center}
.mundial canvas{position:fixed;inset:0;pointer-events:none;z-index:2}
.mu-rayos{position:fixed;left:50%;top:26%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,226,122,.13) 0 12deg,transparent 12deg 24deg);animation:muGira 26s linear infinite;pointer-events:none}
@keyframes muGira{to{transform:rotate(360deg)}}
.mu-in{position:relative;z-index:3;max-width:480px;margin:0 auto;padding:18px 16px 28px;display:grid;gap:6px;justify-items:center}
.mu-est{color:#ffe27a;font-size:26px;letter-spacing:.3em;animation:muLate 1.1s ease-in-out infinite alternate}
@keyframes muLate{to{transform:scale(1.15)}}
.copa{width:min(150px,38vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,226,122,.75));animation:muCopa 1.1s cubic-bezier(.2,1.4,.4,1) both,muSube 1.6s 1.1s ease-in-out infinite alternate}
@keyframes muCopa{0%{transform:translateY(120px) scale(.2) rotate(-25deg)}100%{transform:none}}
@keyframes muSube{to{transform:translateY(-10px) rotate(3deg)}}
.mundial h1{font-size:clamp(28px,9vw,44px);line-height:1;color:#ffe27a;text-shadow:0 3px 0 #2b2620;animation:fjPone .6s .35s cubic-bezier(.2,1.5,.4,1) both}
.mundial h2{font-size:clamp(22px,7vw,32px);line-height:1.05;overflow-wrap:anywhere}
.mu-cono{background:var(--crema);border:3px solid #ffe27a;border-radius:50%;width:58px;height:58px;display:grid;place-items:center}.res{scroll-margin-top:70px}
.mundial p{margin:2px 0 8px;font-size:15.5px}
.mu-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-bottom:10px}
.mu-carta{display:block;animation:cjSale .55s cubic-bezier(.2,1.5,.4,1) both}.mu-carta svg{display:block;width:100%;height:auto}
.res{display:grid;gap:9px}
.res h2{font-size:21px}.res h3{font-size:16.5px;margin-top:5px}
.res-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res-datos div{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:6px 4px;text-align:center}
.res-datos b{display:block;font:400 22px/1.1 var(--d)}.res-datos span{font-size:12.5px}
.res-men{display:grid;gap:6px}
.men{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:7px 10px;display:grid;gap:2px}
.men.top{background:#fbecc0;border-color:var(--oro2)}
.men b{font:400 15.5px/1.15 var(--d)}.men span{font-size:13.5px;line-height:1.25}
.men-dt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}.men-dt i{font-style:normal;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.res-tabla{overflow-x:auto}.res table{width:100%;border-collapse:collapse;font-size:13px}.res th,.res td{padding:5px 4px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}.res th:first-child,.res td:first-child{text-align:left}.res td:first-child{font-weight:700}.res tr.gano{background:#fbecc0}
.res-eq{display:grid;gap:3px}.res-eq>span{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px}
.amigos{background:var(--crema2);border:2px solid var(--tinta);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.amigos h2{font-size:19px}
.amigos input{width:100%;min-height:44px;padding:6px 8px;border:2px solid var(--tinta);border-radius:7px;background:#fff;font:inherit}
#codSala{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.asiento{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea);padding:5px 0;min-height:48px}
.as-n{flex:1;min-width:0;font-weight:700;font-size:14.5px}.as-n em{font-weight:400;color:#5e5446}
.asiento .bt{width:auto;flex:none}
.mc-tok{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc-t{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:2px solid var(--tinta);border-radius:8px;padding:5px 6px;background:var(--crema2)}
.mc-t>b{font:400 14px var(--d)}.mc-t.falta{border-color:var(--rojo)}.mc-t.falta>b{color:var(--rojo)}.mc-t .bt{min-height:36px}
.palco-si{display:block!important;margin-top:4px;font:700 14.5px var(--t)!important;color:var(--rojo)}
.toast.golpe{background:var(--tinta);border:2px solid var(--oro);bottom:auto;top:62px}
.tabs{scroll-margin-top:62px}
.abanico{position:relative;isolation:isolate;margin:4px 0 2px}
.naipe{position:absolute;display:block;padding:0;border:0;background:none;transform-origin:50% 118%;filter:drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.naipe svg{display:block;width:100%;height:100%}
.naipe.trabada{filter:grayscale(.9) brightness(.82) drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.nuevo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-10deg);background:var(--oro);border:2px solid var(--tinta);border-radius:5px;padding:1px 7px;font:400 12px var(--d);font-style:normal}
.mano-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.mano-t h3{font-size:16.5px;white-space:nowrap}.mano-t span{font-size:13px;color:#5e5446;text-align:right}
.cuenta{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:15px}
.cuenta span{display:inline-flex;align-items:center;gap:3px}
.cuenta .tr{color:var(--rojo)}
.ics{display:inline-flex;flex-wrap:wrap;gap:2px;align-items:center;vertical-align:middle}
.tk{display:inline-block;vertical-align:middle;flex:none}.tk svg{display:block;width:100%;height:100%}
.cartita{display:block;padding:0;border:0;background:none;width:100%}.cartita svg{display:block;width:100%;height:auto}
.grande{width:min(250px,66vw);margin:0 auto}.grande svg{display:block;width:100%;height:auto}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:grid;gap:5px;align-content:start}.mc p{margin:0;font-size:13.5px;line-height:1.25}
.trato{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:5px 0 2px;font-weight:700}
.sub{display:block;font-size:13px;color:#5e5446}
.ben-d{width:30px;flex:none}.ben-d svg{display:block;width:100%;height:auto}
.mini-c{display:inline-block;width:15px;vertical-align:middle}.mini-c svg{display:block;width:100%;height:auto}
.chip.ic{display:inline-flex;align-items:center;gap:4px;padding:4px 8px}

.dsc{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fbf8f1;font-family:var(--d);font-size:17px;border:2px solid #fbf8f1;box-shadow:0 0 0 1.5px var(--tinta)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--tinta);border-radius:7px;overflow:hidden;background:var(--crema2)}
.seg button{border:0;background:none;padding:0 2px;font-size:12.5px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--piluso);color:var(--crema)}
.pz-sel{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.pz-sel button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--tinta);border-bottom:0;border-radius:8px 8px 0 0;background:var(--crema2);padding:5px 7px;font-size:12.5px;font-weight:700;min-height:38px}
.pz-sel button[aria-pressed=true]{background:var(--tinta);color:var(--crema)}
.pz{background:var(--sup);color:var(--t);border:6px solid var(--marco);outline:3px solid #8a6a45;border-radius:4px;padding:9px;margin:3px 3px 2px;display:grid;gap:8px}
.pz button{color:var(--t)}
.pz h3{font-size:16.5px;line-height:1.1}.pz i{font-size:12.5px;color:var(--t2)}
.pz h4{font-family:var(--d);font-weight:400;font-size:12.5px;margin:0 0 3px}.pz h4 em{font:400 11.5px var(--t);color:var(--t2)}
.pz-cab{display:flex;gap:8px;align-items:center}
.pz-ret{flex:none;position:relative;width:48px;height:48px;padding:0;border-radius:50%;border:2px solid var(--t);background:var(--marco);cursor:pointer}.pz-ret svg{display:block;width:100%;height:100%;border-radius:50%}
.pz-ret span{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--oro);color:var(--tinta);border:1.5px solid var(--tinta);font:700 15px/1 var(--t);display:flex;align-items:center;justify-content:center;padding:0 0 1px}
.dt-grande{width:min(270px,70vw);margin:0 auto;border:2px solid var(--tinta);border-radius:10px;overflow:hidden}.dt-grande svg{display:block;width:100%;height:auto}
.dt-frase{margin:0;font-style:italic;color:var(--tinta2,#5c554b)}
.bt.oro-c{background:var(--oro)}
.pz-mano{margin:0;font-size:13.5px}
.pz-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pz-vacio{border:1.5px dashed var(--t);border-radius:6px;padding:5px 3px;aspect-ratio:41/63;display:flex;flex-direction:column;gap:5px;text-align:center;font-size:10.5px;line-height:1.15;color:var(--t2);min-width:0}
.pz-vacio b{font:400 9px var(--d);color:var(--t);overflow-wrap:anywhere}
.pz-fila{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.pz-toks{display:flex;gap:7px}.pz-toks span{display:inline-flex;align-items:center;gap:2px}.pz-toks b{font:400 14px var(--d)}.pz-toks .apag{opacity:.38}
.pz-mul{display:flex;gap:3px}
.pz-m{width:36px;height:36px;border:1.5px solid var(--t);border-radius:5px;display:grid;place-items:center;background:rgba(127,127,127,.1)}
.pz-us{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-items:center;border:1.5px dashed var(--t2);border-radius:6px;padding:4px}
.pz-nada{font-size:12px;color:var(--t2);padding-left:4px}
.pz-u{width:62px;height:40px;padding:0;border:0;background:none;position:relative;overflow:hidden}
.pz-u span{position:absolute;left:50%;top:50%;width:39px;transform:translate(-50%,-50%) rotate(90deg)}.pz-u svg{display:block;width:100%;height:auto}

.panel{padding:12px;display:grid;gap:10px}
.aviso{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:10px 12px}
.aviso b{font-family:var(--d);font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.mano{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rec{position:relative;border:0;background:none;padding:0;text-align:center}
.rec svg{display:block;width:100%;max-width:58px;margin:0 auto}
.rec .c{font-family:var(--d);font-size:18px;line-height:1.1}
.rec .mt{position:absolute;top:-3px;right:2px;background:var(--tinta);color:#ffe27a;border-radius:9px;font-size:11.5px;font-weight:700;padding:0 5px}
.rec.trab svg{opacity:.45}
.rec .n{font-size:11.5px;display:block;line-height:1.1}

.bt-empezar{display:flex;align-items:center;justify-content:center;gap:10px;min-height:52px;background:linear-gradient(180deg,#ffe58a,#f0b92c 55%,#d99a12);color:var(--tinta);border:3px solid var(--tinta);border-radius:14px;font:400 19px var(--d);letter-spacing:.03em;box-shadow:0 4px 0 var(--tinta),0 0 18px rgba(255,216,58,.55);position:relative;overflow:hidden;cursor:pointer}
.bt-empezar::after{content:"";position:absolute;inset:-40% auto -40% -30%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:brilloBoton 2.6s ease-in-out infinite}
@keyframes brilloBoton{0%,55%{left:-35%}100%{left:120%}}
.bt-empezar .ic-pelota{width:26px;height:26px;flex:none;animation:pelotaGira 2.2s linear infinite}
.bt-empezar .ic-pelota:last-child{animation-direction:reverse}
@keyframes pelotaGira{to{transform:rotate(360deg)}}
.bt-empezar:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.bt-empezar:disabled{background:#d8cfbd;box-shadow:none;opacity:.8}.bt-empezar:disabled::after{display:none}
.ini-com #empezar{min-height:44px;padding:3px 8px}
.bt-seguir{display:flex;align-items:center;justify-content:center;gap:8px;min-height:40px;background:#2e6b45;color:var(--crema);border:2px solid #fff8d6;border-radius:12px;font:400 15px var(--d);cursor:pointer}
.con-guardado .hero-pasos,.con-guardado .hero-dato{display:none}
.ini-com>.bt.bt-seguir{background:#2e6b45;color:var(--crema);border-color:#fff8d6;min-height:38px}
/* Barra de arriba: el botón de Pausa */
.barra-pausa{flex:none;display:grid;place-items:center;width:40px;height:40px;padding:0;border:2.5px solid var(--dtt,#2b2620);border-radius:50%;background:rgba(255,255,255,.25);color:var(--dtt,#2b2620);cursor:pointer}
.barra-pausa:active{transform:scale(.92)}
.pausa-tit{display:flex;align-items:center;justify-content:center;gap:8px;font-size:26px}
.pausa-bts{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.pausa-bts .cuad{width:66px;height:66px;cursor:pointer}
.cuad.c-reg{background:#e6effa}
/* Los dados bailan sobre el tablero */
.dados-mesa{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:grid;justify-items:center;gap:2px;padding:10px 14px 8px;border:3px solid var(--tinta);border-radius:20px;background:rgba(255,248,214,.93);box-shadow:0 6px 0 var(--tinta),0 0 0 6px rgba(255,216,58,.55);cursor:pointer;animation:dmLatido 1.3s ease-in-out infinite}
.dados-mesa b{font:400 15px var(--d);color:var(--piluso);white-space:nowrap}
.dm-dados{display:flex;gap:12px}
.dm-d{display:block;filter:drop-shadow(0 5px 3px rgba(0,0,0,.35))}
.dm-1{animation:dmBaila .9s ease-in-out infinite}.dm-2{animation:dmBaila .9s ease-in-out infinite .45s}
@keyframes dmBaila{0%,100%{transform:translateY(0) rotate(-10deg)}25%{transform:translateY(-12px) rotate(8deg)}50%{transform:translateY(0) rotate(14deg)}75%{transform:translateY(-6px) rotate(-6deg)}}
@keyframes dmLatido{0%,100%{box-shadow:0 6px 0 var(--tinta),0 0 0 5px rgba(255,216,58,.5)}50%{box-shadow:0 6px 0 var(--tinta),0 0 0 11px rgba(255,216,58,.2)}}
.dados-mesa:active{transform:translate(-50%,-46%)}
/* Mercados vistos: abajo de los dados, sobre el mar */
.hist{position:relative}
.hist-mer{margin-top:auto;display:grid;justify-items:center;gap:0;padding:3px 1px 2px;border:2px solid var(--tinta);border-radius:9px;background:#fff8d6;cursor:pointer;box-shadow:0 2px 0 var(--tinta)}
.hist-mer svg{width:30px;height:auto}.hist-mer small{font:700 9.5px var(--t);color:var(--piluso)}
/* Negocios y Terminar el turno */
.bt.bt-neg{background:#f0b92c;color:var(--tinta);border-color:var(--tinta)}
.bt.bt-neg svg{flex:none}
.bt.bt-fin{background:#2e6b45;color:var(--crema);border-color:#173b25}
.bt.bt-fin svg{flex:none}
.neg-sec{border:2px solid var(--tinta);border-radius:12px;background:#fff;overflow:hidden}
.neg-sec>summary{display:flex;align-items:center;gap:10px;padding:8px 10px;cursor:pointer;list-style:none;background:var(--crema2)}
.neg-sec>summary::-webkit-details-marker{display:none}
.neg-sec.hay>summary{background:#fff3c4}
.neg-sec[open]>summary{background:var(--piluso);color:var(--crema)}
.ns-ic{flex:none;display:flex;align-items:center;justify-content:center;gap:2px;width:58px;height:40px}
.ns-ic .ben-d{width:26px}.ns-ic .ben-d svg{width:100%;height:auto}
.ns-t{flex:1;min-width:0;display:grid;line-height:1.15}.ns-t b{font:400 16px var(--d)}.ns-t small{font-size:12.5px;opacity:.85}
.neg-sec.hay .ns-t small{font-weight:700;color:#8a5a00}.neg-sec[open].hay .ns-t small{color:#ffe27a}
.ns-fl{font-style:normal;font-size:24px;line-height:1;transition:transform .2s}.neg-sec[open] .ns-fl{transform:rotate(90deg)}
.ns-in{display:grid;gap:8px;padding:10px}
.ns-banco{font:400 15px var(--d);display:flex;align-items:center;gap:2px;color:var(--tinta)}.neg-sec[open] .ns-banco{color:var(--crema)}.ns-banco i{font-style:normal;font-size:13px}
.neg-para{background:#fff3c4;border-radius:8px;padding:5px 8px}
/* Tu Mano: sin botones, se desliza. La de al lado asoma. */
.p-mano{position:relative;padding:6px 0 0}
.manos{gap:8px;padding:0 12px;scroll-padding:0 12px}
.mano-p{flex:0 0 calc(100% - 22px)}
.mn-fl{position:absolute;top:42%;z-index:3;display:grid;place-items:center;width:26px;height:44px;border-radius:13px;background:var(--tinta);color:var(--crema);font:700 24px/1 var(--t);box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer;opacity:.85}
.mn-der{right:2px;animation:mnInvita 1.6s ease-in-out 3}
.mn-fl{padding:0;border:0}
.mn-izq{left:2px}
.p-mano.al-ini .mn-izq,.p-mano.al-fin .mn-der{opacity:0;pointer-events:none}
.p-mano .mn-pts{gap:2px;padding:1px 0 0}
.mn-pts button{display:grid;place-items:center;width:26px;height:18px;padding:0;border:0;background:none;cursor:pointer}
@keyframes mnInvita{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px)}}
.mn-pts{display:flex;justify-content:center;gap:6px;padding:4px 0 0}
.mn-pts i{width:9px;height:9px;border-radius:50%;background:var(--dtc);border:1.5px solid var(--tinta);opacity:.45;transition:transform .2s,opacity .2s}
.mn-pts i.on{opacity:1;transform:scale(1.35)}
.mano-p .mano-t h3 .mp-nom{color:var(--tinta);font-family:var(--d);font-weight:400}
.mp-alarma{flex:none;display:grid;place-items:center;min-width:30px;height:24px;padding:0 5px;border:2px solid #7d1f25;border-radius:12px;background:var(--rojo,#d8261f);color:#fff;font:400 13px var(--d);cursor:pointer;animation:alarma 1s ease-in-out infinite}
@keyframes alarma{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(216,38,31,.6)}50%{transform:scale(1.12);box-shadow:0 0 0 5px rgba(216,38,31,0)}}
.mp-m.mp-mv{cursor:pointer;border-style:dashed}
.multa-gen{display:block}
/* +9: la explicación con dibujos */
.m9-alarma{justify-self:center;display:grid;place-items:center;width:64px;height:64px;border-radius:50%;background:var(--rojo,#d8261f);color:#fff;font:400 26px var(--d);border:4px solid #7d1f25;animation:alarma 1s ease-in-out infinite}
.m9-ej{display:grid;gap:8px;background:var(--crema2);border-radius:12px;padding:10px}
.m9-mano{display:flex;justify-content:center}
.m9-c{width:30px;margin-left:-12px;transition:transform .3s}.m9-c:first-child{margin-left:0}.m9-c svg{display:block;width:100%;height:auto}
.m9-c.sale{animation:m9Sale 2.4s ease-in-out infinite}
@keyframes m9Sale{0%,35%{transform:none;opacity:1}60%,85%{transform:translateY(-18px) rotate(-8deg);opacity:.35}100%{transform:none;opacity:1}}
.m9-paso{display:flex;align-items:center;gap:10px;font-size:14px;line-height:1.3}
.m9-n{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;background:#7d1f25;color:#fff;font:400 18px var(--d)}
/* El cartel de cada turno */
.tu-turno.de-otro{background:rgba(20,20,30,.55)}
.tu-turno.de-otro .tt-txt{font-size:clamp(28px,8.5vw,46px);color:#fff}
.tu-turno.de-otro .tt-cara{width:84px;height:84px;border-color:var(--dtc,#ffe27a)}
.tt-n{font:700 14px var(--t);color:#fff8d6;opacity:.85;letter-spacing:.06em;text-transform:uppercase}
/* El arranque del partido */
.arranque{position:fixed;inset:0;z-index:46;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle at 50% 40%,#34498c,#19234a 70%);animation:aparece 3s ease both;overflow:hidden;padding:16px;text-align:center}
.ar-luces{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,216,58,.13) 0 10deg,transparent 10deg 20deg);animation:arGira 6s linear infinite}
@keyframes arGira{to{transform:rotate(360deg)}}
.ar-logo{position:relative;width:96px;animation:ttEntra .6s cubic-bezier(.2,1.6,.4,1) both}
.ar-tit{position:relative;font:400 clamp(30px,9.5vw,56px)/1 var(--d);color:#ffe27a;text-shadow:0 3px 0 #2b2620;animation:ttEntra .6s cubic-bezier(.2,1.6,.4,1) .15s both}
.ar-dts{position:relative;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.ar-dt{display:grid;justify-items:center;gap:2px;animation:arEntra .5s cubic-bezier(.2,1.5,.4,1) both}
.ar-dt b{font:700 11.5px var(--t);color:#fff8d6;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ar-cara{display:block;width:56px;height:56px;border-radius:50%;overflow:hidden;border:3px solid var(--dtc,#fff);background:#efe7d4}.ar-cara svg{display:block;width:100%;height:100%}
@keyframes arEntra{0%{transform:translateY(60px) scale(.4);opacity:0}100%{transform:none;opacity:1}}
.ar-pelota{position:absolute;bottom:14%;left:-60px;width:44px;height:44px;animation:arPelota 2.4s cubic-bezier(.4,0,.6,1) .5s both}.ar-pelota svg{width:100%;height:100%}
@keyframes arPelota{0%{left:-60px;transform:translateY(0) rotate(0)}25%{transform:translateY(-70px) rotate(180deg)}50%{transform:translateY(0) rotate(360deg)}75%{transform:translateY(-35px) rotate(540deg)}100%{left:calc(100% + 60px);transform:translateY(0) rotate(720deg)}}
.ar-sub{position:relative;font:700 14px var(--t);color:#fff8d6;letter-spacing:.05em}
/* ===== Ronda 43 ===== */
/* El Defensor cobra */
.def-cobra{animation-duration:3.4s;background:rgba(20,30,50,.82)}
.def-cobra .fj-tit span{max-width:330px;line-height:1.3}
.dc-mesa{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:center;gap:6px;width:min(360px,94vw)}
.dc-lado{display:grid;justify-items:center;gap:6px;position:relative}
.dc-mu{position:relative;display:block}.dc-mu .sello{font-size:11px}
.dc-centro{position:relative;display:grid;place-items:center;height:170px}
.dc-def{display:block;width:96px;position:relative;animation:dcDef 3.4s ease both}.dc-def>svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.dc-escudo{position:absolute;right:-14px;top:-12px;animation:dcEscudo 3.4s ease both}
.dc-carta{position:absolute;width:52px;left:50%;top:50%;margin:-40px 0 0 -26px;animation:dcVuela 3.4s cubic-bezier(.5,0,.4,1) both;z-index:2}.dc-carta svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 4px rgba(0,0,0,.5))}
.dc-mas{font:400 30px var(--d);color:#7dff9a;text-shadow:0 2px 0 #1b3a22;animation:dcMas 3.4s ease both}
@keyframes dcDef{0%,10%{transform:scale(.5) rotate(-8deg);opacity:0}22%{transform:scale(1.08);opacity:1}30%,100%{transform:none;opacity:1}}
@keyframes dcEscudo{0%,40%{transform:scale(0)}50%{transform:scale(1.4) rotate(-12deg)}58%,100%{transform:scale(1)}}
@keyframes dcVuela{0%,18%{transform:translate(-120px,30px) scale(.8) rotate(-20deg);opacity:0}28%{opacity:1;transform:translate(-110px,20px) scale(.9)}50%{transform:translate(0,-10px) scale(1.15) rotate(8deg)}58%{transform:translate(0,-14px) scale(1.15)}82%,100%{transform:translate(118px,26px) scale(.75) rotate(14deg);opacity:1}}
@keyframes dcMas{0%,76%{opacity:0;transform:translateY(10px)}84%{opacity:1;transform:translateY(-6px) scale(1.3)}92%,100%{opacity:1;transform:none}}
.mv-cab{display:flex;align-items:center;gap:10px;margin:0 0 6px}.mv-cab small{color:#5e5446}.ico-merc{flex:none}
/* La oferta: mismo borde de color que El Relator y sale deslizándose desde abajo de él */
.relator .of{border-left:12px solid var(--dtc,var(--tinta))}
.of.sale{animation:ofSale .45s cubic-bezier(.2,.9,.3,1) both}
@keyframes ofSale{from{clip-path:inset(0 -30px 100% -30px);opacity:.4}to{clip-path:inset(0 -30px -40px -30px);opacity:1}}
/* Las ventanas suben desde abajo y se cierran arrastrándolas */
.hoja{position:relative;touch-action:pan-y}
.hoja.entra{animation:hojaSube .32s cubic-bezier(.2,.9,.3,1) both}
@keyframes hojaSube{from{transform:translateY(100%)}to{transform:none}}
.modal:has(.hoja.entra){animation:modalFondo .32s ease both}
@keyframes modalFondo{from{background:rgba(20,20,30,0)}}
.hoja-asa{display:grid;place-items:center;height:12px;margin:-8px 0 -8px;cursor:grab;touch-action:none}
.hoja-asa i{display:block;width:46px;height:5px;border-radius:3px;background:var(--tinta);opacity:.3}
.ficha-acc{display:grid;gap:6px}
.ficha-acc .bt{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;min-height:46px}
/* Negocios: cinco tarjetas fijas */
.ng{display:grid;gap:5px;border:2px solid var(--tinta);border-radius:12px;padding:6px 8px 7px;background:linear-gradient(180deg,#fffaf0,#f3ead7)}
.hoja.entra .ng,.hoja.entra .ng-oferta{animation:ngEntra .4s cubic-bezier(.2,1.2,.4,1) both}
.hoja.entra .ng:nth-of-type(2){animation-delay:.05s}.hoja.entra .ng:nth-of-type(3){animation-delay:.1s}.hoja.entra .ng:nth-of-type(4){animation-delay:.15s}.hoja.entra .ng-oferta{animation-delay:.2s}
@keyframes ngEntra{from{opacity:0;transform:translateY(14px)}}
.ng.hay{border-color:#b8862b;box-shadow:0 0 0 2px rgba(255,216,58,.6)}
.ng-cab{display:flex;align-items:center;gap:7px;min-width:0}
.ng-cab b{font:400 14.5px var(--d);white-space:nowrap}.ng-cab small{margin-left:auto;font-size:12px;color:#5e5446;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ng.hay .ng-cab small{color:#8a5a00;font-weight:700}
.ng-ic{flex:none;display:flex;align-items:center;gap:1px}.ng-ic .ben-d{width:18px}.ng-ic .ben-d svg{width:100%;height:auto;display:block}
.ng-bts{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ng-bt{position:relative;overflow:hidden;flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:4px 8px;border:2px solid var(--tinta);border-radius:11px;background:#fff;color:var(--tinta);cursor:pointer;box-shadow:0 3px 0 var(--tinta);transition:transform .12s,box-shadow .12s}
.ng-bt.chico{flex:1 1 0;padding:3px 2px;gap:1px}.ng-bt.mini{flex:none;min-height:30px;padding:2px 4px;box-shadow:0 2px 0 var(--tinta)}
.ng-bt.ok{background:linear-gradient(180deg,#fff3c4,#ffd96a)}
.ng-bt.ok::after{content:"";position:absolute;top:-20%;bottom:-20%;left:-40%;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:skewX(-20deg);animation:ngBrillo 3s ease-in-out infinite}
.ng-bt.ok:nth-child(2)::after{animation-delay:.6s}.ng-bt.ok:nth-child(3)::after{animation-delay:1.2s}
@keyframes ngBrillo{0%,60%{left:-40%}100%{left:130%}}
.ng-bt:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--tinta)}
.ng-bt:disabled{opacity:.42;cursor:default;box-shadow:0 2px 0 rgba(43,38,32,.4)}
.ng-bt.ok-toma{background:#e8f4ea}
.ng-vuelve{flex:none!important;background:var(--piluso)!important;color:var(--crema)!important;padding:3px 6px!important}
.ng-pr{display:flex;align-items:center}.ng-pr svg{margin-left:-2px}
.ng-tx{font:400 15px var(--d)}
.ng-dorso{width:22px}.ng-dorso svg{display:block;width:100%;height:auto}
.ng-n{font:400 13px var(--d)}
.ng-fl{font-style:normal;font-size:13px;font-weight:700}
.ng-arq{font:700 9.5px var(--t);background:var(--tinta);color:var(--crema);border-radius:4px;padding:0 3px}
.ng-nada{font-size:13px;color:#5e5446;padding:4px 2px}
.ng-usados{display:flex;align-items:center;gap:4px;width:100%}.ng-usados small{font-size:11.5px;font-weight:700;margin-right:2px}
.ng-oferta{display:flex;align-items:center;gap:10px;width:100%;min-height:58px;padding:6px 12px;border:2.5px solid var(--tinta);border-radius:14px;background:linear-gradient(180deg,#ffe58a,#f0b92c);color:var(--tinta);text-align:left;cursor:pointer;box-shadow:0 4px 0 var(--tinta);position:relative;overflow:hidden}
.ng-oferta svg{flex:none;animation:ngApreton 2.4s ease-in-out infinite}
@keyframes ngApreton{0%,70%,100%{transform:none}76%{transform:translateY(-3px) rotate(-6deg)}82%{transform:translateY(1px) rotate(4deg)}88%{transform:translateY(-2px)}}
.ng-oferta span{display:grid;line-height:1.15}.ng-oferta b{font:400 17px var(--d)}.ng-oferta small{font-size:12.5px}
.ng-oferta:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--tinta)}
.ng-oferta:disabled{background:#e4ddcc;box-shadow:none;opacity:.7;cursor:default}.ng-oferta:disabled svg{animation:none}
@media (prefers-reduced-motion:reduce){.hoja.entra,.of.sale,.ng-bt.ok::after,.ng-oferta svg,.hoja.entra .ng{animation:none}}
@media (prefers-reduced-motion:reduce){.dm-1,.dm-2,.dados-mesa,.bt-empezar::after,.bt-empezar .ic-pelota,.mp-alarma,.m9-alarma,.m9-c.sale,.ar-luces,.ar-pelota,.mn-der{animation:none}}
/* ===== Ronda 44 ===== */
/* Las ventanas son un cajón pegado abajo: sube al abrir, baja al cerrar, y se arrastra con el dedo. Sin cruz. */
@media (max-width:999px){
  .modal{padding:0}
  .hoja{border-radius:20px 20px 0 0;max-height:calc(100dvh - 54px);padding:6px 14px max(16px,calc(env(safe-area-inset-bottom) + 12px));box-shadow:0 -6px 24px rgba(0,0,0,.35)}
  .con-mano .hoja{max-height:calc(100dvh - 184px)}
  .modal.con-mano .neg-mano{margin-bottom:6px}
}
.modal.se-va{transition:background .23s ease;background:rgba(20,20,30,0)!important}
.hoja-asa{position:sticky;top:-6px;z-index:3;display:grid;place-items:center;width:calc(100% + 28px);height:22px;margin:-6px -14px -6px;padding:0;border:0;background:linear-gradient(var(--crema) 60%,transparent);cursor:grab;touch-action:none}
.hoja-asa i{width:52px;height:6px;border-radius:3px;background:var(--tinta);opacity:.35}
.hoja-asa:active{cursor:grabbing}.hoja-asa:active i{opacity:.6}
.hoja>.x-cerrar{display:none}
/* Las pestañas de las manos: una por DT, con su nombre. La elegida se pega a la mano; la del DT que juega, iluminada. */
.mn-pts{display:none}
.mn-tabs{position:relative;z-index:2;display:flex;gap:3px;margin:0 10px 0 12px;padding:0 9px}
.mn-tab{position:relative;flex:1 1 0;min-width:0;height:21px;margin-top:-3px;padding:3px 4px 0;border:0;border-radius:0 0 9px 9px;background:var(--dtc);color:var(--dtt);font:700 11px/18px var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.62;cursor:pointer;box-shadow:inset 0 3px 3px -2px rgba(0,0,0,.35);transition:opacity .2s,height .2s}
.mn-tab span{display:block;overflow:hidden;text-overflow:ellipsis}
.mn-tab.on{opacity:1;height:24px;background:color-mix(in srgb,var(--dtc) 30%,var(--crema));color:var(--tinta);box-shadow:inset 3px 0 0 var(--dtc),inset -3px 0 0 var(--dtc),inset 0 -3px 0 var(--dtc)}
.mn-tab.turno{opacity:1;outline:2.5px solid #ffd83a;outline-offset:-2.5px;animation:tabTurno 1.6s ease-in-out infinite}
.mn-tab.turno::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:250% 100%;animation:tabBrillo 2.4s linear infinite;pointer-events:none}
.mn-tab.turno.on{outline:none;box-shadow:inset 3px 0 0 var(--dtc),inset -3px 0 0 var(--dtc),inset 0 -3px 0 var(--dtc),0 3px 10px 1px rgba(255,200,40,.85)}
@keyframes tabTurno{0%,100%{filter:brightness(1)}50%{filter:brightness(1.18) drop-shadow(0 0 4px #ffd83a)}}
@keyframes tabBrillo{from{background-position:150% 0}to{background-position:-100% 0}}
/* Las cartas de la mano un poquito más arriba: el abanico no agranda el cuadro */
.mano-p .abanico{margin-top:-6px}
/* El lugar vacío de un Jugador: los de esa posición que viste */
.pos-vistos{display:grid;gap:7px;background:#eef2fb;border:2px solid var(--piluso);border-radius:12px;padding:8px 10px}
.pos-vistos>b{display:flex;align-items:center;gap:7px;font:400 15px var(--d);color:var(--piluso)}
.pv-l{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.pv-c{display:grid;gap:3px;justify-items:center;padding:0;border:0;background:none;cursor:pointer;color:var(--tinta)}
.pv-c .cartita{display:block;width:100%}.pv-c .cartita svg{display:block;width:100%;height:auto}
.pv-c small{display:flex;align-items:center;gap:3px;font-size:11px;line-height:1.1;text-align:left}
.pv-c small svg{flex:none}
@media (prefers-reduced-motion:reduce){.mn-tab.turno,.mn-tab.turno::before{animation:none}}
/* ===== Ronda 45 ===== */
/* Un Jugador entra en acción */
.fichaje.jug-ayuda{background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--dtc) 40%,#14182c),rgba(14,16,30,.94) 70%)}
.ay-escena{position:relative;display:grid;place-items:center;width:min(230px,58vw);aspect-ratio:410/630}
.ay-rayos{position:absolute;inset:-45%;background:repeating-conic-gradient(rgba(255,216,58,.32) 0 9deg,transparent 9deg 22deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 30%,transparent 68%);mask:radial-gradient(circle,#000 30%,transparent 68%);animation:ayRayos 6s linear infinite}
.ay-jug{position:relative;display:block;width:100%;animation:ayEntra .9s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.ay-jug svg{display:block;width:100%;height:auto}
.ay-pos{position:absolute;left:50%;bottom:-14px;transform:translateX(-50%) rotate(-4deg);background:#ffd83a;color:var(--tinta);border:3px solid var(--tinta);border-radius:10px;padding:3px 12px;font:400 20px var(--d);white-space:nowrap;animation:aySello .5s .7s cubic-bezier(.2,1.8,.4,1) both;box-shadow:0 4px 0 var(--tinta)}
.ay-mesa{display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;margin-top:6px}
.ay-c{display:block;width:62px;animation:ayCarta .6s 1.1s cubic-bezier(.2,1.4,.4,1) both}.ay-c svg{display:block;width:100%;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.ay-c2{animation-delay:1.5s}.ay-c3{margin-left:-36px;animation-delay:1.7s}
.ay-sale{animation:ayCarta .6s 1.6s cubic-bezier(.2,1.6,.4,1) both}
.ay-x{font:400 34px var(--d);color:#ffd83a;text-shadow:0 3px 0 var(--tinta);animation:ayCarta .5s 1.35s cubic-bezier(.2,1.8,.4,1) both}
.ay-fl{font-style:normal;font-size:30px;color:#ffd83a;animation:ayCarta .4s 1.4s both}
.ay-mu{position:relative;display:block;animation:ayCarta .6s 1.2s both}.ay-mu .sello{animation-delay:1.8s}
.ay-rebota{animation:ayRebota 1.6s 1s ease-in both}
@keyframes ayRayos{to{transform:rotate(360deg)}}
@keyframes ayEntra{0%{transform:translateY(60px) scale(.4) rotate(-12deg);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes aySello{from{transform:translateX(-50%) scale(2.4) rotate(-14deg);opacity:0}to{transform:translateX(-50%) rotate(-4deg);opacity:1}}
@keyframes ayCarta{from{transform:translateY(30px) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes ayRebota{0%{transform:translate(-160px,-120px) rotate(-30deg);opacity:0}15%{opacity:1}45%{transform:translate(0,0) rotate(0)}60%{transform:translate(0,0) scale(1.12,.86)}100%{transform:translate(180px,-200px) rotate(40deg);opacity:0}}
/* Revolear los dados */
.revoleo{position:fixed;inset:0;z-index:46;pointer-events:none}
.rv-d{position:absolute;left:0;top:0;width:52px;height:52px;will-change:transform;filter:drop-shadow(0 7px 5px rgba(0,0,0,.4))}
.rv-d svg{display:block}
.rv-d.cae svg{animation:rvCae .5s cubic-bezier(.2,1.8,.4,1)}
.revoleo.listo .rv-d{filter:drop-shadow(0 0 10px #ffd83a) drop-shadow(0 6px 4px rgba(0,0,0,.35))}
.revoleo.listo{animation:rvSale .5s ease-in 1.6s both}
@keyframes rvCae{0%{transform:scale(1.35)}100%{transform:none}}
@keyframes rvSale{to{opacity:0}}
.dados-mesa.agarrado .dm-dados{opacity:.2}.dados-mesa.agarrado b{opacity:0}
.dados-mesa{touch-action:none;cursor:grab}
@media (prefers-reduced-motion:reduce){.ay-rayos,.ay-jug,.ay-pos,.ay-c,.ay-x,.ay-fl,.ay-mu,.ay-rebota{animation:none}}
