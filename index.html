<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEXA Dream Team</title>
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Courier+Prime:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--tinta:#2b2620;--crema:#f6efe0;--crema2:#fbf8f1;--linea:#d9cdb4;--piluso:#22305a;--piluso2:#2e3f73;--oro:#e2bd57;--oro2:#b8862b;--rojo:#b8323a;--gol:#3f6aa6;--suerte:#4d7a3a;--picardia:#d9a61c;--fans:#d4692a;--sponsors:#b23f3c;--agua:#8fc3df;--d:"Bowlby One SC",Impact,sans-serif;--m:"Courier Prime",monospace;--t:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--piluso);color:var(--tinta);font-family:var(--t);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--tinta);cursor:pointer;touch-action:manipulation}
input{color:var(--tinta);-webkit-text-fill-color:var(--tinta);opacity:1}
input::placeholder{color:#7b7262;-webkit-text-fill-color:#7b7262}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;overflow-x:clip;background:var(--crema);display:flex;flex-direction:column}
.bt{display:block;width:100%;min-height:46px;padding:10px 14px;border:2px solid var(--tinta);border-radius:8px;background:var(--crema2);font-weight:700;text-align:center}
.bt.fuerte{background:var(--piluso);color:var(--crema);border-color:var(--piluso);font-family:var(--d);font-weight:400;letter-spacing:.03em}
.bt.oro{background:var(--oro);font-family:var(--d);font-weight:400}
.bt.chico{min-height:40px;padding:6px 10px;font-size:14.5px}
.fila{display:flex;gap:8px;align-items:stretch}.fila>*{flex:1;min-width:0}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0}
.barra{background:var(--piluso);color:var(--crema);padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.reloj{flex:none;font:400 18px var(--d);padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.14);min-width:62px;text-align:center;white-space:nowrap}
.reloj[hidden]{display:none}
.reloj.urgente{background:var(--rojo);color:#fff;animation:relojLatido 1s ease-in-out infinite}
.reloj.pausa{font-size:13px;background:rgba(226,189,87,.28);color:#ffe9a8}
@keyframes relojLatido{50%{transform:scale(1.1)}}
.barra .cono{flex:none}
.barra .q{flex:1;min-width:0;line-height:1.2}
.barra .q b{display:block;font-family:var(--d);font-weight:400;font-size:17px}
.barra .q span{font-size:13.5px;opacity:.9}
.dados{display:flex;gap:5px;flex:none}
.dd{display:block;flex:none}
.mesa{display:flex;background:var(--agua);align-items:stretch}
#tablero{display:block;flex:1;min-width:0;width:100%;height:auto;background:var(--agua);touch-action:manipulation}
.hist{flex:none;width:46px;padding:6px 3px 6px 0;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.hist-t{font-family:var(--d);font-size:10.5px;text-align:center;color:var(--piluso)}
.ht{display:flex;gap:1px;justify-content:center;background:rgba(251,248,241,.62);border-radius:5px;border-left:4px solid transparent;padding:3px 1px;box-shadow:0 0 0 1px rgba(43,38,32,.35)}
.ht.ult{background:#fbf8f1;box-shadow:0 0 0 2px var(--tinta)}
.ht.vacio{height:25px;background:rgba(251,248,241,.25);box-shadow:none;border-left:0}
.activa{fill:#fff3a0;stroke:#ffd83a;stroke-width:5;stroke-linejoin:round;animation:brillo 3.2s ease-out forwards}
@keyframes brillo{0%{opacity:0}6%{opacity:.85}20%{opacity:.5}34%{opacity:.85}48%{opacity:.5}62%{opacity:.8}100%{opacity:0}}
.tiro{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:14px;z-index:15;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.rueda{animation:rueda .75s cubic-bezier(.2,.8,.3,1)}
.rueda.r2{animation-duration:.9s}
@keyframes rueda{0%{transform:translateY(-70px) rotate(-420deg) scale(.5)}70%{transform:translateY(6px) rotate(12deg) scale(1.08)}100%{transform:none}}
.trueque{position:fixed;left:50%;top:128px;transform:translateX(-50%);width:min(92vw,470px);background:rgba(34,48,90,.96);color:var(--crema);border:3px solid var(--oro);border-radius:14px;padding:10px 12px 14px;z-index:15;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.45);animation:aparece 2.1s ease both}
.trueque h3{text-align:center;font-size:20px;color:var(--oro);margin-bottom:6px}
.tq-fila{display:flex;align-items:center;gap:6px}
.tq-dt{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tq-dt b{font:400 12px/1.05 var(--d);overflow-wrap:anywhere}
.tq-banco{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--oro);color:var(--tinta);font:400 22px var(--d);border:2px solid var(--crema)}
.tq-mesa{position:relative;flex:1;min-width:0;height:136px}
.tq-c{position:absolute;width:40px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}.tq-c svg{display:block;width:100%;height:auto}
.tq-c.ida{top:0;animation:tqIda 1.15s ease-in-out both}
.tq-c.vuelta{bottom:0;animation:tqVuelta 1.15s ease-in-out both}
@keyframes tqIda{0%{left:0;transform:rotate(-14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:calc(100% - 40px);transform:rotate(8deg);opacity:1}}
@keyframes tqVuelta{0%{left:calc(100% - 40px);transform:rotate(14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:0;transform:rotate(-8deg);opacity:1}}
@keyframes aparece{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
.fichaje{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,20,30,.72);z-index:15;pointer-events:none;perspective:900px;animation:aparece 2.8s ease both;padding:16px;text-align:center}
.fj-tit{color:var(--crema)}.fj-tit b{display:block;font:400 22px/1.1 var(--d);color:var(--oro)}.fj-tit span{font-size:14.5px}
.fj-gira{position:relative;width:min(230px,58vw);aspect-ratio:41/63;transform-style:preserve-3d;animation:fjGira 1.15s cubic-bezier(.2,.75,.3,1) both}
.fj-cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.fj-cara svg{display:block;width:100%;height:100%}
.fj-dorso{transform:rotateY(180deg)}
@keyframes fjGira{0%{transform:translateY(60px) rotateY(540deg) scale(.45)}100%{transform:none}}
.fichaje.corto{animation-duration:1.9s;background:rgba(20,20,30,.5)}
.fichaje.corto .fj-gira{width:min(170px,44vw);animation-duration:.85s}
.fichaje.corto .fj-tit b{font-size:19px}
.fj-pone{position:relative;width:min(180px,48vw);animation:fjPone .45s cubic-bezier(.2,1.5,.4,1) both}.fj-pone>svg{display:block;width:100%;height:auto}
@keyframes fjPone{0%{transform:scale(.3) rotate(-10deg)}100%{transform:none}}
.sello{position:absolute;left:50%;top:44%;font:400 25px var(--d);font-style:normal;color:var(--rojo);background:rgba(251,248,241,.9);border:4px solid var(--rojo);border-radius:8px;padding:2px 10px;white-space:nowrap;transform:translate(-50%,-50%) rotate(-14deg);animation:sello .4s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes sello{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.6)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.cj-mesa{position:relative;width:min(320px,86vw);height:180px}
.cj-c{position:absolute;left:50%;top:30px;width:56px;margin-left:-28px;animation:cjEntra .95s ease-in both}.cj-c svg{display:block;width:100%;height:auto}
.cj-solo{--x:-120px;animation-duration:.7s}
@keyframes cjEntra{0%{transform:translateX(var(--x,0)) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(0,12px) scale(.3) rotate(160deg);opacity:0}}
.cj-tk{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;animation:cjSale .5s .85s cubic-bezier(.2,1.6,.4,1) both}.cj-tk svg{display:block;width:100%;height:100%}
@keyframes cjSale{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.cj-mu{position:absolute;left:50%;top:50%;margin:-65px 0 0 -65px;display:block;width:130px;height:130px}.cj-mu svg{display:block}
.mundial{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 28%,#3a5499,#22305a 55%,#141c38);color:var(--crema);overflow:auto;text-align:center}
.mundial canvas{position:fixed;inset:0;pointer-events:none;z-index:2}
.mu-rayos{position:fixed;left:50%;top:26%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,226,122,.13) 0 12deg,transparent 12deg 24deg);animation:muGira 26s linear infinite;pointer-events:none}
@keyframes muGira{to{transform:rotate(360deg)}}
.mu-in{position:relative;z-index:3;max-width:480px;margin:0 auto;padding:18px 16px 28px;display:grid;gap:6px;justify-items:center}
.mu-est{color:#ffe27a;font-size:26px;letter-spacing:.3em;animation:muLate 1.1s ease-in-out infinite alternate}
@keyframes muLate{to{transform:scale(1.15)}}
.copa{width:min(150px,38vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,226,122,.75));animation:muCopa 1.1s cubic-bezier(.2,1.4,.4,1) both,muSube 1.6s 1.1s ease-in-out infinite alternate}
@keyframes muCopa{0%{transform:translateY(120px) scale(.2) rotate(-25deg)}100%{transform:none}}
@keyframes muSube{to{transform:translateY(-10px) rotate(3deg)}}
.mundial h1{font-size:clamp(28px,9vw,44px);line-height:1;color:#ffe27a;text-shadow:0 3px 0 #2b2620;animation:fjPone .6s .35s cubic-bezier(.2,1.5,.4,1) both}
.mundial h2{font-size:clamp(22px,7vw,32px);line-height:1.05;overflow-wrap:anywhere}
.mu-cono{background:var(--crema);border:3px solid #ffe27a;border-radius:50%;width:58px;height:58px;display:grid;place-items:center}.res{scroll-margin-top:70px}
.mundial p{margin:2px 0 8px;font-size:15.5px}
.mu-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-bottom:10px}
.mu-carta{display:block;animation:cjSale .55s cubic-bezier(.2,1.5,.4,1) both}.mu-carta svg{display:block;width:100%;height:auto}
.res{display:grid;gap:9px}
.res h2{font-size:21px}.res h3{font-size:16.5px;margin-top:5px}
.res-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res-datos div{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:6px 4px;text-align:center}
.res-datos b{display:block;font:400 22px/1.1 var(--d)}.res-datos span{font-size:12.5px}
.res-men{display:grid;gap:6px}
.men{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:7px 10px;display:grid;gap:2px}
.men.top{background:#fbecc0;border-color:var(--oro2)}
.men b{font:400 15.5px/1.15 var(--d)}.men span{font-size:13.5px;line-height:1.25}
.men-dt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}.men-dt i{font-style:normal;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.res-tabla{overflow-x:auto}.res table{width:100%;border-collapse:collapse;font-size:13px}.res th,.res td{padding:5px 4px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}.res th:first-child,.res td:first-child{text-align:left}.res td:first-child{font-weight:700}.res tr.gano{background:#fbecc0}
.res-eq{display:grid;gap:3px}.res-eq>span{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px}
.amigos{background:var(--crema2);border:2px solid var(--tinta);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.amigos h2{font-size:19px}
.amigos input{width:100%;min-height:44px;padding:6px 8px;border:2px solid var(--tinta);border-radius:7px;background:#fff;font:inherit}
#codSala{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.asiento{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea);padding:5px 0;min-height:48px}
.as-n{flex:1;min-width:0;font-weight:700;font-size:14.5px}.as-n em{font-weight:400;color:#5e5446}
.asiento .bt{width:auto;flex:none}
.mc-tok{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc-t{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:2px solid var(--tinta);border-radius:8px;padding:5px 6px;background:var(--crema2)}
.mc-t>b{font:400 14px var(--d)}.mc-t.falta{border-color:var(--rojo)}.mc-t.falta>b{color:var(--rojo)}.mc-t .bt{min-height:36px}
.palco-si{display:block!important;margin-top:4px;font:700 14.5px var(--t)!important;color:var(--rojo)}
.toast.golpe{background:var(--tinta);border:2px solid var(--oro);bottom:auto;top:62px}
.tabs{scroll-margin-top:62px}
.abanico{position:relative;isolation:isolate;margin:4px 0 2px}
.naipe{position:absolute;display:block;padding:0;border:0;background:none;transform-origin:50% 118%;filter:drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.naipe svg{display:block;width:100%;height:100%}
.naipe.trabada{filter:grayscale(.9) brightness(.82) drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.nuevo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-10deg);background:var(--oro);border:2px solid var(--tinta);border-radius:5px;padding:1px 7px;font:400 12px var(--d);font-style:normal}
.mano-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.mano-t h3{font-size:16.5px;white-space:nowrap}.mano-t span{font-size:13px;color:#5e5446;text-align:right}
.cuenta{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:15px}
.cuenta span{display:inline-flex;align-items:center;gap:3px}
.cuenta .tr{color:var(--rojo)}
.ics{display:inline-flex;flex-wrap:wrap;gap:2px;align-items:center;vertical-align:middle}
.tk{display:inline-block;vertical-align:middle;flex:none}.tk svg{display:block;width:100%;height:100%}
.cartita{display:block;padding:0;border:0;background:none;width:100%}.cartita svg{display:block;width:100%;height:auto}
.grande{width:min(250px,66vw);margin:0 auto}.grande svg{display:block;width:100%;height:auto}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:grid;gap:5px;align-content:start}.mc p{margin:0;font-size:13.5px;line-height:1.25}
.trato{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:5px 0 2px;font-weight:700}
.sub{display:block;font-size:13px;color:#5e5446}
.ben-d{width:30px;flex:none}.ben-d svg{display:block;width:100%;height:auto}
.mini-c{display:inline-block;width:15px;vertical-align:middle}.mini-c svg{display:block;width:100%;height:auto}
.chip.ic{display:inline-flex;align-items:center;gap:4px;padding:4px 8px}
.neg-i{display:inline-flex;align-items:center;gap:4px}.neg-i small{font-size:12.5px;color:#5e5446}
.dsc{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fbf8f1;font-family:var(--d);font-size:17px;border:2px solid #fbf8f1;box-shadow:0 0 0 1.5px var(--tinta)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--tinta);border-radius:7px;overflow:hidden;background:var(--crema2)}
.seg button{border:0;background:none;padding:0 2px;font-size:12.5px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--piluso);color:var(--crema)}
.pz-sel{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.pz-sel button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--tinta);border-bottom:0;border-radius:8px 8px 0 0;background:var(--crema2);padding:5px 7px;font-size:12.5px;font-weight:700;min-height:38px}
.pz-sel button[aria-pressed=true]{background:var(--tinta);color:var(--crema)}
.pz{background:var(--sup);color:var(--t);border:6px solid var(--marco);outline:3px solid #8a6a45;border-radius:4px;padding:9px;margin:3px 3px 2px;display:grid;gap:8px}
.pz button{color:var(--t)}
.pz h3{font-size:16.5px;line-height:1.1}.pz i{font-size:12.5px;color:var(--t2)}
.pz h4{font-family:var(--d);font-weight:400;font-size:12.5px;margin:0 0 3px}.pz h4 em{font:400 11.5px var(--t);color:var(--t2)}
.pz-cab{display:flex;gap:8px;align-items:center}
.pz-ret{flex:none;position:relative;width:48px;height:48px;padding:0;border-radius:50%;border:2px solid var(--t);background:var(--marco);cursor:pointer}.pz-ret svg{display:block;width:100%;height:100%;border-radius:50%}
.pz-ret span{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--oro);color:var(--tinta);border:1.5px solid var(--tinta);font:700 15px/16px var(--t);text-align:center}
.dt-grande{width:min(270px,70vw);margin:0 auto;border:2px solid var(--tinta);border-radius:10px;overflow:hidden}.dt-grande svg{display:block;width:100%;height:auto}
.dt-frase{margin:0;font-style:italic;color:var(--tinta2,#5c554b)}
.bt.oro-c{background:var(--oro)}
.pz-mano{margin:0;font-size:13.5px}
.pz-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pz-vacio{border:1.5px dashed var(--t);border-radius:6px;padding:5px 3px;aspect-ratio:41/63;display:flex;flex-direction:column;gap:5px;text-align:center;font-size:10.5px;line-height:1.15;color:var(--t2);min-width:0}
.pz-vacio b{font:400 9px var(--d);color:var(--t);overflow-wrap:anywhere}
.pz-fila{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.pz-toks{display:flex;gap:7px}.pz-toks span{display:inline-flex;align-items:center;gap:2px}.pz-toks b{font:400 14px var(--d)}.pz-toks .apag{opacity:.38}
.pz-mul{display:flex;gap:3px}
.pz-m{width:36px;height:36px;border:1.5px solid var(--t);border-radius:5px;display:grid;place-items:center;background:rgba(127,127,127,.1)}
.pz-us{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-items:center;border:1.5px dashed var(--t2);border-radius:6px;padding:4px}
.pz-nada{font-size:12px;color:var(--t2);padding-left:4px}
.pz-u{width:62px;height:40px;padding:0;border:0;background:none;position:relative;overflow:hidden}
.pz-u span{position:absolute;left:50%;top:50%;width:39px;transform:translate(-50%,-50%) rotate(90deg)}.pz-u svg{display:block;width:100%;height:auto}

.panel{padding:12px;display:grid;gap:10px}
.aviso{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:10px 12px}
.aviso b{font-family:var(--d);font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.mano{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rec{position:relative;border:0;background:none;padding:0;text-align:center}
.rec svg{display:block;width:100%;max-width:58px;margin:0 auto}
.rec .c{font-family:var(--d);font-size:18px;line-height:1.1}
.rec .mt{position:absolute;top:-3px;right:2px;background:var(--tinta);color:#ffe27a;border-radius:9px;font-size:11.5px;font-weight:700;padding:0 5px}
.rec.trab svg{opacity:.45}
.rec .n{font-size:11.5px;display:block;line-height:1.1}
.equipo{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.fig{border:2px solid var(--tinta);border-radius:7px;padding:6px 3px;text-align:center;font-size:12.5px;background:var(--crema2);line-height:1.15;min-height:62px;display:flex;flex-direction:column;justify-content:center;width:100%}
.fig b{font-family:var(--d);font-weight:400;font-size:13.5px;display:block;overflow-wrap:anywhere}
.fig.vacia{border-style:dashed;color:#7b7262;background:none}
.resumen{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14.5px}
.tok{display:inline-flex;align-items:center;gap:4px;font-weight:700}
.tok i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;border:1.5px solid var(--tinta);font-size:12.5px}
.tok .v{background:#e2bd57}.tok .e{background:#57a06c;color:#fff}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--tinta);border-bottom:2px solid var(--tinta);background:var(--crema2)}
.tabs button{border:0;background:none;padding:10px 2px;font-size:13.5px;font-weight:700;min-height:44px;border-right:1px solid var(--linea)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed=true]{background:var(--tinta);color:var(--crema)}
.op{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--linea);padding:8px 0}
.op:last-child{border-bottom:0}
.op>div{flex:1;min-width:0;font-size:14.5px;line-height:1.25}
.op>div b{display:block;font-size:15.5px}
.op>button{flex:none;width:auto;min-width:84px}
.sel{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:2px solid var(--tinta);border-radius:20px;background:var(--crema2);padding:6px 10px;min-height:38px;font-size:14px;font-weight:700}
.chip[aria-pressed=true]{background:var(--tinta);color:var(--crema)}
.carta{border:2px solid var(--tinta);border-radius:9px;padding:9px 10px;background:var(--crema2);display:grid;gap:4px}
.carta h3{font-size:16.5px}.carta p{margin:0;font-size:14.5px;line-height:1.3}
.carta.bloq{opacity:.7}
.num{display:flex;align-items:center;gap:6px;justify-content:space-between}
.num button{width:38px;height:38px;border-radius:8px;border:2px solid var(--tinta);background:var(--crema2);font-weight:700;font-size:18px}
.num span{font-family:var(--d);min-width:22px;text-align:center}
.negocio{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 8px;align-items:center;font-size:14.5px}
.modal{position:fixed;inset:0;background:rgba(20,20,30,.72);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--crema);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px;display:grid;gap:10px}
.hoja h2{font-size:21px}
.cubre{position:fixed;inset:0;background:var(--piluso);color:var(--crema);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.cubre h2{font-size:26px}.cubre .bt{max-width:300px}
.reg{font-size:14px;display:grid;gap:3px;max-height:320px;overflow:auto}
.reg div{border-bottom:1px dotted var(--linea);padding:2px 0}
.reg .priv{color:#7b4fa3;font-weight:700}
.rival{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:center;border-bottom:1px solid var(--linea);padding:7px 0;font-size:14px}
.rival b{display:block;font-size:15.5px}
.ini{padding:18px 16px 28px;display:grid;gap:14px}
.ini h1{font-size:44px;line-height:.95;text-align:center;color:var(--piluso)}
.ini h1 small{display:block;font-size:17px;color:var(--oro2);letter-spacing:.06em;margin-top:4px}
.ini .logo{display:block;width:62%;max-width:240px;margin:0 auto}
.dtelige{display:flex;align-items:center;gap:9px;padding:7px;border:2px solid var(--linea);border-radius:10px;background:var(--crema2);opacity:.72}.dtelige.on{border-color:var(--tinta);opacity:1}
.dt-cara{position:relative;flex:none}
.dt-tog{display:block;width:58px;height:58px;padding:0;border-radius:50%;overflow:hidden;border:2.5px solid var(--tinta);background:#efe7d4;cursor:pointer}.dt-tog svg{display:block;width:100%;height:100%}
.dtelige:not(.on) .dt-tog svg{filter:grayscale(1)}
.dt-tog.chico{width:46px;height:46px}.dt-tog.mio{outline:3px solid var(--oro);outline-offset:1px}.dt-tog:disabled{opacity:.3;cursor:not-allowed}
.dt-mas{position:absolute;right:-6px;bottom:-6px;width:28px;height:28px;padding:0;border-radius:50%;background:var(--oro);color:var(--tinta);border:2px solid var(--tinta);font:700 18px/20px var(--t);cursor:pointer}
.dt-dat{flex:1;min-width:0;display:grid;gap:5px}.dt-dat input{width:100%;min-width:0;min-height:40px;padding:5px 8px;border:2px solid var(--tinta);border-radius:7px;background:#fff;font:inherit}.dt-dat .nota{margin:0;font-size:12.5px}
.dt-fila-sel{display:flex;gap:8px;flex-wrap:wrap}
.dtfila{display:grid;grid-template-columns:30px minmax(0,1fr) 138px;gap:8px;align-items:center}
.dtfila input{width:100%;min-height:44px;padding:6px 8px;border:2px solid var(--tinta);border-radius:7px;background:var(--crema2);font:inherit}
.nota{font-size:13.5px;color:#5e5446;line-height:1.3}
.toast.ok{background:var(--piluso)}
.toast{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--rojo);color:#fff;padding:9px 14px;border-radius:9px;z-index:40;max-width:92%;font-weight:700;font-size:14.5px;text-align:center}
.campeon{background:var(--oro);padding:16px;text-align:center;border-bottom:2px solid var(--tinta)}
.campeon h2{font-size:24px}
@keyframes lat{50%{opacity:.25}}
.lat{animation:lat 1.2s infinite}
/* Versión para computadora: el tablero fijo a la izquierda y todo lo demás al costado */
@media (min-width:1000px){
  #app{max-width:none;background:var(--crema)}
  .ini{width:100%;max-width:640px;margin:0 auto}
  .juego{display:grid;grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .barra{grid-column:1/-1;padding:8px 20px;min-height:56px}
  .mesa{grid-column:1;position:sticky;top:56px;height:calc(100vh - 56px);justify-content:center;min-width:0}
  #tablero{height:100%;width:100%;flex:1 1 auto;min-width:0}
  .hist{width:66px;padding:12px 8px 12px 0}
  .col-der{grid-column:2;min-width:0;border-left:2px solid var(--tinta);min-height:calc(100vh - 56px);background:var(--crema)}
  .modal{align-items:center}
  .hoja{border-radius:14px;max-width:560px}
  button:not(:disabled):hover{filter:brightness(1.06)}
  .cartita{transition:transform .12s ease}
  .cartita:hover{transform:translateY(-3px) scale(1.03)}
  #panel .bt.oro,#panel .bt.fuerte{cursor:pointer}
}
@media (min-width:1500px){
  .juego{grid-template-columns:minmax(0,1fr) 880px}
  .col-der{display:grid;grid-template-columns:440px 440px;align-items:start}
  .col-der>#panel{grid-column:1;grid-row:1}
  .col-der>.p-tabs{grid-column:1;grid-row:2}
  .col-der>.p-pz{grid-column:2;grid-row:1 / span 3;padding-top:12px!important;border-left:2px solid var(--linea);min-height:calc(100vh - 56px)}
  .col-der>.campeon,.col-der>.campeon+.panel{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){.reloj.urgente{animation:none}.lat,.rueda,.fj-gira,.fj-pone,.mu-rayos,.mu-est,.copa,.mu-carta,.cj-tk{animation:none}.tq-c.ida,.tq-c.vuelta{animation-duration:.01s}}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script>
// El SDK de Firebase solo se carga si el juego tiene configuración de salas
if(window.PEXA_FIREBASE){document.write('<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"><\/script>');}
</script>
<script src="red.js"></script>
<script src="juego.js"></script>
<script src="iconos.js"></script>
<script src="cartas.js"></script>
<script src="ui.js"></script>
</body>
</html>
