<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PEXA Dream Team</title>
<link rel="icon" type="image/png" sizes="32x32" href="icono-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icono-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icono-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#22305a">
<meta name="apple-mobile-web-app-title" content="PEXA">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One+SC&family=Courier+Prime:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{--tinta:#2b2620;--crema:#f6efe0;--crema2:#fbf8f1;--linea:#d9cdb4;--piluso:#22305a;--piluso2:#2e3f73;--oro:#e2bd57;--oro2:#b8862b;--rojo:#b8323a;--gol:#3f6aa6;--suerte:#4d7a3a;--picardia:#d9a61c;--fans:#d4692a;--sponsors:#b23f3c;--agua:#8fc3df;--d:"Bowlby One SC",Impact,sans-serif;--m:"Courier Prime",monospace;--t:"Atkinson Hyperlegible",system-ui,sans-serif}
*{box-sizing:border-box}
:root{color-scheme:light}
html,body{margin:0;background:var(--piluso);color:var(--tinta);font-family:var(--t);font-size:16px;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:var(--tinta);cursor:pointer;touch-action:manipulation}
input{color:var(--tinta);-webkit-text-fill-color:var(--tinta);opacity:1}
input::placeholder{color:#7b7262;-webkit-text-fill-color:#7b7262}
button:disabled{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--oro2);outline-offset:2px}
#app{max-width:520px;margin:0 auto;min-height:100vh;overflow-x:clip;background:var(--crema);display:flex;flex-direction:column}
.bt{display:block;width:100%;min-height:46px;padding:10px 14px;border:2px solid var(--tinta);border-radius:8px;background:var(--crema2);font-weight:700;text-align:center}
.bt.fuerte{background:var(--piluso);color:var(--crema);border-color:var(--piluso);font-family:var(--d);font-weight:400;letter-spacing:.03em}
.bt.oro{background:var(--oro);font-family:var(--d);font-weight:400}
.bt.chico{min-height:40px;padding:6px 10px;font-size:14.5px}
.fila{display:flex;gap:8px;align-items:stretch}.fila>*{flex:1;min-width:0}
h1,h2,h3{font-family:var(--d);font-weight:400;margin:0}
.barra{background:var(--piluso);color:var(--crema);padding:8px 12px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
.reloj{flex:none;font:400 18px var(--d);padding:4px 9px;border-radius:7px;background:rgba(255,255,255,.14);min-width:62px;text-align:center;white-space:nowrap}
.reloj[hidden]{display:none}
.reloj.urgente{background:var(--rojo);color:#fff;animation:relojLatido 1s ease-in-out infinite}
.reloj.pausa{font-size:13px;background:rgba(226,189,87,.28);color:#ffe9a8}
@keyframes relojLatido{50%{transform:scale(1.1)}}
.barra .cono{flex:none}
.barra-dt{background:var(--dtc);color:var(--dtt);border-bottom:2px solid rgba(0,0,0,.35);transition:background .4s}
.barra-cono{flex:none;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--crema);box-shadow:0 0 0 2px rgba(0,0,0,.35)}
.barra .q{flex:1;min-width:0;line-height:1.2}
.barra .q b{display:block;font-family:var(--d);font-weight:400;font-size:17px}
.barra .q span{font-size:13.5px;opacity:.9}
.dados{display:flex;gap:5px;flex:none}
.dd{display:block;flex:none}
.mesa{display:flex;background:var(--agua);align-items:stretch}
#tablero{display:block;flex:1;min-width:0;width:100%;height:auto;background:var(--agua);touch-action:manipulation}
.hist{flex:none;width:46px;padding:6px 3px 6px 0;display:flex;flex-direction:column;gap:5px;align-items:stretch}
.hist-t{font-family:var(--d);font-size:10.5px;text-align:center;color:var(--piluso)}
.ht{display:flex;gap:1px;justify-content:center;background:rgba(251,248,241,.62);border-radius:5px;border-left:4px solid transparent;padding:3px 1px;box-shadow:0 0 0 1px rgba(43,38,32,.35)}
.ht.ult{background:#fbf8f1;box-shadow:0 0 0 2px var(--tinta)}
.ht.vacio{height:25px;background:rgba(251,248,241,.25);box-shadow:none;border-left:0}
.activa{fill:#fff3a0;stroke:#ffd83a;stroke-width:5;stroke-linejoin:round;animation:brillo 3.2s ease-out forwards}
@keyframes brillo{0%{opacity:0}6%{opacity:.85}20%{opacity:.5}34%{opacity:.85}48%{opacity:.5}62%{opacity:.8}100%{opacity:0}}
.tiro{position:fixed;left:50%;top:150px;transform:translateX(-50%);display:flex;gap:14px;z-index:45;pointer-events:none;filter:drop-shadow(0 8px 8px rgba(0,0,0,.45))}
.rueda{animation:rueda .75s cubic-bezier(.2,.8,.3,1)}
.rueda.r2{animation-duration:.9s}
@keyframes rueda{0%{transform:translateY(-70px) rotate(-420deg) scale(.5)}70%{transform:translateY(6px) rotate(12deg) scale(1.08)}100%{transform:none}}
.trueque{position:fixed;left:50%;top:128px;transform:translateX(-50%);width:min(92vw,470px);background:rgba(34,48,90,.96);color:var(--crema);border:3px solid var(--oro);border-radius:14px;padding:10px 12px 14px;z-index:45;pointer-events:none;box-shadow:0 10px 24px rgba(0,0,0,.45);animation:aparece 2.1s ease both}
.trueque h3{text-align:center;font-size:20px;color:var(--oro);margin-bottom:6px}
.tq-fila{display:flex;align-items:center;gap:6px}
.tq-dt{flex:none;width:74px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center}
.tq-dt b{font:400 12px/1.05 var(--d);overflow-wrap:anywhere}
.tq-banco{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--oro);color:var(--tinta);font:400 22px var(--d);border:2px solid var(--crema)}
.tq-mesa{position:relative;flex:1;min-width:0;height:136px}
.tq-c{position:absolute;width:40px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}.tq-c svg{display:block;width:100%;height:auto}
.tq-c.ida{top:0;animation:tqIda 1.15s ease-in-out both}
.tq-c.vuelta{bottom:0;animation:tqVuelta 1.15s ease-in-out both}
@keyframes tqIda{0%{left:0;transform:rotate(-14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:calc(100% - 40px);transform:rotate(8deg);opacity:1}}
@keyframes tqVuelta{0%{left:calc(100% - 40px);transform:rotate(14deg) scale(.7);opacity:0}15%{opacity:1}100%{left:0;transform:rotate(-8deg);opacity:1}}
@keyframes aparece{0%{opacity:0}8%{opacity:1}88%{opacity:1}100%{opacity:0}}
.fichaje{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(20,20,30,.72);z-index:45;pointer-events:none;perspective:900px;animation:aparece 2.8s ease both;padding:16px;text-align:center}
.fj-tit{color:var(--crema)}.fj-tit b{display:block;font:400 22px/1.1 var(--d);color:var(--oro)}.fj-tit span{font-size:14.5px}
.fj-gira{position:relative;width:min(230px,58vw);aspect-ratio:41/63;transform-style:preserve-3d;animation:fjGira 1.15s cubic-bezier(.2,.75,.3,1) both}
.fj-cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}.fj-cara svg{display:block;width:100%;height:100%}
.fj-dorso{transform:rotateY(180deg)}
@keyframes fjGira{0%{transform:translateY(60px) rotateY(540deg) scale(.45)}100%{transform:none}}
.fichaje.corto{animation-duration:1.9s;background:rgba(20,20,30,.5)}
.fichaje.corto .fj-gira{width:min(170px,44vw);animation-duration:.85s}
.fichaje.corto .fj-tit b{font-size:19px}
.fj-pone{position:relative;width:min(180px,48vw);animation:fjPone .45s cubic-bezier(.2,1.5,.4,1) both}.fj-pone>svg{display:block;width:100%;height:auto}
@keyframes fjPone{0%{transform:scale(.3) rotate(-10deg)}100%{transform:none}}
.sello{position:absolute;left:50%;top:44%;font:400 25px var(--d);font-style:normal;color:var(--rojo);background:rgba(251,248,241,.9);border:4px solid var(--rojo);border-radius:8px;padding:2px 10px;white-space:nowrap;transform:translate(-50%,-50%) rotate(-14deg);animation:sello .4s .6s cubic-bezier(.2,1.4,.4,1) both}
@keyframes sello{0%{opacity:0;transform:translate(-50%,-50%) rotate(-14deg) scale(2.6)}100%{opacity:1;transform:translate(-50%,-50%) rotate(-14deg) scale(1)}}
.cj-mesa{position:relative;width:min(320px,86vw);height:180px}
.cj-c{position:absolute;left:50%;top:30px;width:56px;margin-left:-28px;animation:cjEntra .95s ease-in both}.cj-c svg{display:block;width:100%;height:auto}
.cj-solo{--x:-120px;animation-duration:.7s}
@keyframes cjEntra{0%{transform:translateX(var(--x,0)) scale(1);opacity:1}70%{opacity:1}100%{transform:translate(0,12px) scale(.3) rotate(160deg);opacity:0}}
.cj-tk{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;animation:cjSale .5s .85s cubic-bezier(.2,1.6,.4,1) both}.cj-tk svg{display:block;width:100%;height:100%}
@keyframes cjSale{0%{transform:scale(0) rotate(-40deg)}100%{transform:none}}
.cj-mu{position:absolute;left:50%;top:50%;margin:-65px 0 0 -65px;display:block;width:130px;height:130px}.cj-mu svg{display:block}
.mundial{position:fixed;inset:0;z-index:35;background:radial-gradient(circle at 50% 28%,#3a5499,#22305a 55%,#141c38);color:var(--crema);overflow:auto;text-align:center}
.mundial canvas{position:fixed;inset:0;pointer-events:none;z-index:2}
.mu-rayos{position:fixed;left:50%;top:26%;width:200vmax;height:200vmax;margin:-100vmax 0 0 -100vmax;background:repeating-conic-gradient(rgba(255,226,122,.13) 0 12deg,transparent 12deg 24deg);animation:muGira 26s linear infinite;pointer-events:none}
@keyframes muGira{to{transform:rotate(360deg)}}
.mu-in{position:relative;z-index:3;max-width:480px;margin:0 auto;padding:18px 16px 28px;display:grid;gap:6px;justify-items:center}
.mu-est{color:#ffe27a;font-size:26px;letter-spacing:.3em;animation:muLate 1.1s ease-in-out infinite alternate}
@keyframes muLate{to{transform:scale(1.15)}}
.copa{width:min(150px,38vw);height:auto;filter:drop-shadow(0 0 22px rgba(255,226,122,.75));animation:muCopa 1.1s cubic-bezier(.2,1.4,.4,1) both,muSube 1.6s 1.1s ease-in-out infinite alternate}
@keyframes muCopa{0%{transform:translateY(120px) scale(.2) rotate(-25deg)}100%{transform:none}}
@keyframes muSube{to{transform:translateY(-10px) rotate(3deg)}}
.mundial h1{font-size:clamp(28px,9vw,44px);line-height:1;color:#ffe27a;text-shadow:0 3px 0 #2b2620;animation:fjPone .6s .35s cubic-bezier(.2,1.5,.4,1) both}
.mundial h2{font-size:clamp(22px,7vw,32px);line-height:1.05;overflow-wrap:anywhere}
.mu-cono{background:var(--crema);border:3px solid #ffe27a;border-radius:50%;width:58px;height:58px;display:grid;place-items:center}.res{scroll-margin-top:70px}
.mundial p{margin:2px 0 8px;font-size:15.5px}
.mu-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%;margin-bottom:10px}
.mu-carta{display:block;animation:cjSale .55s cubic-bezier(.2,1.5,.4,1) both}.mu-carta svg{display:block;width:100%;height:auto}
.res{display:grid;gap:9px}
.res h2{font-size:21px}.res h3{font-size:16.5px;margin-top:5px}
.res-datos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.res-datos div{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:6px 4px;text-align:center}
.res-datos b{display:block;font:400 22px/1.1 var(--d)}.res-datos span{font-size:12.5px}
.res-men{display:grid;gap:6px}
.men{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:7px 10px;display:grid;gap:2px}
.men.top{background:#fbecc0;border-color:var(--oro2)}
.men b{font:400 15.5px/1.15 var(--d)}.men span{font-size:13.5px;line-height:1.25}
.men-dt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}.men-dt i{font-style:normal;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.res-tabla{overflow-x:auto}.res table{width:100%;border-collapse:collapse;font-size:13px}.res th,.res td{padding:5px 4px;border-bottom:1px solid var(--linea);text-align:center;white-space:nowrap}.res th:first-child,.res td:first-child{text-align:left}.res td:first-child{font-weight:700}.res tr.gano{background:#fbecc0}
.res-eq{display:grid;gap:3px}.res-eq>span{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:4px}
.amigos{background:var(--crema2);border:2px solid var(--tinta);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.amigos h2{font-size:19px}
.amigos input{width:100%;min-height:44px;padding:6px 8px;border:2px solid var(--tinta);border-radius:7px;background:#fff;font:inherit}
#codSala{text-transform:uppercase;letter-spacing:.2em;font-weight:700}
.asiento{display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--linea);padding:5px 0;min-height:48px}
.as-n{flex:1;min-width:0;font-weight:700;font-size:14.5px}.as-n em{font-weight:400;color:#5e5446}
.asiento .bt{width:auto;flex:none}
.mc-tok{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mc-t{display:flex;flex-wrap:wrap;align-items:center;gap:4px;border:2px solid var(--tinta);border-radius:8px;padding:5px 6px;background:var(--crema2)}
.mc-t>b{font:400 14px var(--d)}.mc-t.falta{border-color:var(--rojo)}.mc-t.falta>b{color:var(--rojo)}.mc-t .bt{min-height:36px}
.palco-si{display:block!important;margin-top:4px;font:700 14.5px var(--t)!important;color:var(--rojo)}
.toast.golpe{background:var(--tinta);border:2px solid var(--oro);bottom:auto;top:62px}
.tabs{scroll-margin-top:62px}
.abanico{position:relative;isolation:isolate;margin:4px 0 2px}
.naipe{position:absolute;display:block;padding:0;border:0;background:none;transform-origin:50% 118%;filter:drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.naipe svg{display:block;width:100%;height:100%}
.naipe.trabada{filter:grayscale(.9) brightness(.82) drop-shadow(-1px 2px 2px rgba(0,0,0,.28))}
.nuevo{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%) rotate(-10deg);background:var(--oro);border:2px solid var(--tinta);border-radius:5px;padding:1px 7px;font:400 12px var(--d);font-style:normal}
.mano-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:2px}
.mano-t h3{font-size:16.5px;white-space:nowrap}.mano-t span{font-size:13px;color:#5e5446;text-align:right}
.cuenta{display:flex;justify-content:space-between;gap:4px;font-weight:700;font-size:15px}
.cuenta span{display:inline-flex;align-items:center;gap:3px}
.cuenta .tr{color:var(--rojo)}
.ics{display:inline-flex;flex-wrap:wrap;gap:2px;align-items:center;vertical-align:middle}
.tk{display:inline-block;vertical-align:middle;flex:none}.tk svg{display:block;width:100%;height:100%}
.cartita{display:block;padding:0;border:0;background:none;width:100%}.cartita svg{display:block;width:100%;height:auto}
.grande{width:min(250px,66vw);margin:0 auto}.grande svg{display:block;width:100%;height:auto}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{display:grid;gap:5px;align-content:start}.mc p{margin:0;font-size:13.5px;line-height:1.25}
.trato{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin:5px 0 2px;font-weight:700}
.sub{display:block;font-size:13px;color:#5e5446}
.ben-d{width:30px;flex:none}.ben-d svg{display:block;width:100%;height:auto}
.mini-c{display:inline-block;width:15px;vertical-align:middle}.mini-c svg{display:block;width:100%;height:auto}
.chip.ic{display:inline-flex;align-items:center;gap:4px;padding:4px 8px}

.dsc{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fbf8f1;font-family:var(--d);font-size:17px;border:2px solid #fbf8f1;box-shadow:0 0 0 1.5px var(--tinta)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:2px solid var(--tinta);border-radius:7px;overflow:hidden;background:var(--crema2)}
.seg button{border:0;background:none;padding:0 2px;font-size:12.5px;font-weight:700;min-height:40px}
.seg button[aria-pressed=true]{background:var(--piluso);color:var(--crema)}
.pz-sel{display:flex;gap:4px;margin-top:6px;overflow-x:auto}
.pz-sel button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;border:2px solid var(--tinta);border-bottom:0;border-radius:8px 8px 0 0;background:var(--crema2);padding:5px 7px;font-size:12.5px;font-weight:700;min-height:38px}
.pz-sel button[aria-pressed=true]{background:var(--tinta);color:var(--crema)}
.pz{background:var(--sup);color:var(--t);border:6px solid var(--marco);outline:3px solid #8a6a45;border-radius:4px;padding:9px;margin:3px 3px 2px;display:grid;gap:8px}
.pz button{color:var(--t)}
.pz h3{font-size:16.5px;line-height:1.1}.pz i{font-size:12.5px;color:var(--t2)}
.pz h4{font-family:var(--d);font-weight:400;font-size:12.5px;margin:0 0 3px}.pz h4 em{font:400 11.5px var(--t);color:var(--t2)}
.pz-cab{display:flex;gap:8px;align-items:center}
.pz-ret{flex:none;position:relative;width:48px;height:48px;padding:0;border-radius:50%;border:2px solid var(--t);background:var(--marco);cursor:pointer}.pz-ret svg{display:block;width:100%;height:100%;border-radius:50%}
.pz-ret span{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--oro);color:var(--tinta);border:1.5px solid var(--tinta);font:700 15px/1 var(--t);display:flex;align-items:center;justify-content:center;padding:0 0 1px}
.dt-grande{width:min(270px,70vw);margin:0 auto;border:2px solid var(--tinta);border-radius:10px;overflow:hidden}.dt-grande svg{display:block;width:100%;height:auto}
.dt-frase{margin:0;font-style:italic;color:var(--tinta2,#5c554b)}
.bt.oro-c{background:var(--oro)}
.pz-mano{margin:0;font-size:13.5px}
.pz-eq{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.pz-vacio{border:1.5px dashed var(--t);border-radius:6px;padding:5px 3px;aspect-ratio:41/63;display:flex;flex-direction:column;gap:5px;text-align:center;font-size:10.5px;line-height:1.15;color:var(--t2);min-width:0}
.pz-vacio b{font:400 9px var(--d);color:var(--t);overflow-wrap:anywhere}
.pz-fila{display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.pz-toks{display:flex;gap:7px}.pz-toks span{display:inline-flex;align-items:center;gap:2px}.pz-toks b{font:400 14px var(--d)}.pz-toks .apag{opacity:.38}
.pz-mul{display:flex;gap:3px}
.pz-m{width:36px;height:36px;border:1.5px solid var(--t);border-radius:5px;display:grid;place-items:center;background:rgba(127,127,127,.1)}
.pz-us{display:flex;flex-wrap:wrap;gap:4px;min-height:44px;align-items:center;border:1.5px dashed var(--t2);border-radius:6px;padding:4px}
.pz-nada{font-size:12px;color:var(--t2);padding-left:4px}
.pz-u{width:62px;height:40px;padding:0;border:0;background:none;position:relative;overflow:hidden}
.pz-u span{position:absolute;left:50%;top:50%;width:39px;transform:translate(-50%,-50%) rotate(90deg)}.pz-u svg{display:block;width:100%;height:auto}

.panel{padding:12px;display:grid;gap:10px}
.aviso{background:var(--crema2);border:2px solid var(--tinta);border-radius:8px;padding:10px 12px}
.aviso b{font-family:var(--d);font-weight:400;font-size:16px;display:block;margin-bottom:2px}
.mano{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.rec{position:relative;border:0;background:none;padding:0;text-align:center}
.rec svg{display:block;width:100%;max-width:58px;margin:0 auto}
.rec .c{font-family:var(--d);font-size:18px;line-height:1.1}
.rec .mt{position:absolute;top:-3px;right:2px;background:var(--tinta);color:#ffe27a;border-radius:9px;font-size:11.5px;font-weight:700;padding:0 5px}
.rec.trab svg{opacity:.45}

/* Tutorial */
.tuto-barra{height:6px;background:var(--linea)}.tuto-barra i{display:block;height:100%;background:var(--oro2);transition:width .3s}
.tuto-toca{grid-column:span 1;display:flex;align-items:center;justify-content:center;font:400 15px var(--d);color:var(--piluso);text-align:center;min-height:54px;border:2px dashed var(--piluso);border-radius:8px;flex:1}
.acc-prim>.tuto-toca:only-child{grid-column:1/-1}
.tuto-extra{padding-bottom:0}
.tuto-filas{display:grid;gap:6px}
.tuto-of{background:#fffdf6;border:3px solid var(--piluso);border-radius:12px;padding:10px;display:grid;gap:8px}
.tuto-ben{grid-template-columns:repeat(3,1fr)}
.bt.of-si{background:#2f7d46;color:#fff;border-color:#1f5a30}
.acc-prim,.acc{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 0}
.acc-prim{position:sticky;bottom:0;z-index:4;background:linear-gradient(transparent,var(--crema) 8px);padding-bottom:6px}
.acc{padding-top:2px}
.acc-prim>:only-child,.acc-prim>.ancho,.acc>.ancho{grid-column:1/-1}
.dtn{display:inline-block;padding:0 6px;border-radius:5px;background:var(--c);color:var(--t);font-weight:700;box-shadow:0 0 0 1.2px rgba(0,0,0,.55);line-height:1.3;white-space:nowrap;font-family:var(--t)}
.ent.mal{border-color:#d8261f;background:#fde0dc;animation:sacude .35s ease}
@keyframes sacude{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bt.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25d366;color:#0b2e17;border-color:#128c4a;font-weight:700}
.compartir.wa{background:#25d366;color:#0b2e17;border-color:#128c4a;gap:6px}
/* Las manos */
.manos-nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}.manos-nav::-webkit-scrollbar{display:none}
.manos-nav button{flex:1 0 auto;display:flex;align-items:center;justify-content:center;gap:4px;border:1.5px solid var(--linea);border-radius:14px;background:var(--crema2);padding:2px 8px;font-size:12.5px;font-weight:700;min-height:30px}
.manos-nav button[aria-selected=true]{background:var(--tinta);color:var(--crema);border-color:var(--tinta)}
.manos{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}.manos::-webkit-scrollbar{display:none}
.mano-p{flex:0 0 100%;min-width:0;scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden}
.mano-p .mano-t{align-items:center;justify-content:flex-start}
.mano-p .mano-t h3{flex:1;min-width:0}
.mp-cara{flex:none;width:34px;height:34px;padding:0;border-radius:50%;overflow:hidden;border:2px solid var(--tinta);background:#efe7d4}.mp-cara svg{display:block;width:100%;height:100%}
.mp-roja{display:inline-block;width:11px;height:15px;background:#d8261f;border:1.5px solid #fff;border-radius:2px;vertical-align:middle;box-shadow:0 0 0 1px var(--tinta)}
.mano-vacia{min-height:40px;display:flex;align-items:center}
.mp-v{padding:0;background:none;width:36px}
.mp-t{padding:0;border:0;background:none}
/* Es tu turno y lo que cobraste */
.tu-turno{animation-duration:1.5s;background:rgba(34,48,90,.82)}
.tt-txt{font:400 clamp(36px,11vw,64px)/1 var(--d);color:#ffe27a;text-shadow:0 3px 0 #2b2620;animation:ttEntra .5s cubic-bezier(.2,1.6,.4,1) both}
.tt-cara{display:block;width:110px;height:110px;border-radius:50%;overflow:hidden;border:5px solid #ffe27a;background:#efe7d4;animation:ttEntra .5s cubic-bezier(.2,1.6,.4,1) both}.tt-cara svg{display:block;width:100%;height:100%}
@keyframes ttEntra{0%{transform:scale(.2) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.cobro{animation-duration:1.8s}
.cb-fila{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;max-width:92vw}
.cb-c{display:block;width:74px;animation:cbEntra .5s cubic-bezier(.2,1.4,.4,1) both}.cb-c svg{display:block;width:100%;height:auto}
.cb-m{position:relative;display:block;animation:cbEntra .5s cubic-bezier(.2,1.4,.4,1) both}.cb-m.reb svg{opacity:.55}
@keyframes cbEntra{0%{transform:translateY(-60px) scale(.5) rotate(-12deg);opacity:0}100%{transform:none;opacity:1}}
.ruta{fill:none;stroke:#ffd83a;stroke-width:9;stroke-linejoin:round;stroke-dasharray:16 10;animation:rutaVa 1s linear infinite;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
@keyframes rutaVa{to{stroke-dashoffset:-26}}
.tuto-obj{animation:llama 1.2s ease-in-out infinite;box-shadow:0 0 0 3px var(--oro)}
.tuto-tit{font-size:18px;color:var(--piluso);background:var(--crema2);border:2px solid var(--piluso);border-radius:10px;padding:7px 10px;text-align:center}
/* Mercado */
.mc.elegida .cartita{outline:4px solid var(--oro2);outline-offset:2px;border-radius:6px}
.mc-pie{position:sticky;bottom:-14px;background:var(--crema);border-top:2px solid var(--tinta);padding:8px 0 10px;display:grid;gap:6px}
/* El final */
.res-pl{border:2px solid var(--plc,var(--piluso));border-radius:12px;background:var(--crema2);overflow:hidden}
.res-pl>summary{cursor:pointer;padding:11px 12px;font:400 16.5px var(--d);background:var(--plc,var(--piluso));color:var(--plt,#fbf8f1)}
.res-pl[open]>summary{margin-bottom:8px}
.mesa-fin{display:block;position:relative;border-radius:8px;overflow:hidden}
.es-fin .res{padding:0 0 18px}
.es-fin .res>:not(.cert-vista){margin-inline:10px}
.fin-bts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.fin-bts .bt{min-width:0;font-size:14.5px;line-height:1.15;padding-inline:8px}
.cert-pista{text-align:center;font-size:13.5px;font-weight:700;color:var(--piluso)}
.res-in{padding:0 10px 10px;display:grid;gap:8px}
.res-in h4{margin:6px 0 0;font:400 14px var(--d)}
.bars{display:grid;gap:4px}.bar{display:grid;grid-template-columns:32px minmax(0,1fr) 28px;align-items:center;gap:6px}.bar>b{font:400 14px var(--d);text-align:right}
.bar-v{height:13px;border-radius:7px;background:rgba(0,0,0,.08);overflow:hidden;display:block}.bar-v i{display:block;height:100%;background:var(--piluso);border-radius:7px}
.res-datos.cur{margin-top:8px}.res-datos.cur span{font-size:11.5px;line-height:1.1;display:block}
.res-tabla table{font-size:12.5px}.res-tabla td:first-child{white-space:normal;min-width:118px;font-weight:700}.res-tabla th{white-space:normal;text-align:center}.res-tabla td.max{background:#fbecc0;font-weight:700}
.res .res-eq{display:grid;gap:6px;padding-top:4px}.res-eq-t{font-size:14px}
.inf-l{display:grid;gap:6px}.inf{display:grid;grid-template-columns:52px minmax(0,1fr);gap:9px;align-items:center;background:#fffdf6;border:1px solid var(--linea);border-radius:8px;padding:5px}
.inf>div{display:grid;gap:1px}.inf b{font:400 14px var(--d)}.inf span{font-size:13px;line-height:1.2}
.inf-e{color:var(--oro2);font-size:16px!important;letter-spacing:.06em}.inf-e em{font-style:normal;color:#d9cdb4}
.res-men{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.res .men{position:relative;transform:rotate(var(--gira,0));background:linear-gradient(160deg,#fffdf6,#f4ead2);border:2px solid var(--piluso);border-radius:12px;padding:30px 8px 8px;text-align:center;justify-items:center;box-shadow:0 3px 7px rgba(0,0,0,.18)}
.res .men.top{background:linear-gradient(160deg,#fff5cf,#f0cf6f);border-color:var(--oro2)}
.men-ic{position:absolute;left:50%;top:3px;transform:translateX(-50%);font-size:24px;line-height:1.1}
.res .men b{font-size:14px}.res .men>span:not(.men-ic){font-size:12.5px}.res .men-dt{justify-content:center}
.cert-vista{display:block;width:100%;padding:0;margin:0;border:0;background:none;cursor:pointer;line-height:0}
.cert-bts{display:grid;gap:7px}
.cert-bts[hidden]{display:none}
.bt.festejo{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(120deg,#5b4a8a,#22305a);color:#ffe27a;border-color:#2b2620;font-family:var(--d);font-weight:400}
.fes-copa{height:30px;width:auto;flex:none}
.fes-ic i{position:absolute;width:7px;height:10px;top:-12px;animation:fesCae 1.8s linear infinite}
.fes-ic i:nth-child(1){left:12%;background:#ffe27a}.fes-ic i:nth-child(2){left:34%;background:#4d7a3a;animation-delay:.5s}.fes-ic i:nth-child(3){left:62%;background:#d4692a;animation-delay:1s}.fes-ic i:nth-child(4){left:86%;background:#3f6aa6;animation-delay:.3s}
@keyframes fesCae{to{transform:translateY(70px) rotate(300deg)}}
/* Creá tu DT */
.bt.crea{background:linear-gradient(120deg,#ffe27a,#e2bd57);font-family:var(--d);font-weight:400}
.dt-grande.chica{width:min(190px,50vw)}.grande.chica{width:min(150px,42vw)}
.cr-f{display:grid;gap:4px}.cr-f>b{font:400 14px var(--d);color:var(--piluso)}.cr-f .chip{font-size:13px;min-height:34px;padding:4px 9px}
/* Reglas */
.rm{display:grid;gap:5px;margin-top:8px}.rm-f{display:grid;grid-template-columns:32px minmax(0,1fr) 26px 32px minmax(0,72px);gap:6px;align-items:center;background:#fffdf6;border:1.5px solid var(--rc);border-left-width:7px;border-radius:8px;padding:4px 6px}
.rm-f>span{display:grid;line-height:1.1}.rm-f>span b{font:400 13.5px var(--d)}.rm-f small{font-size:11.5px;color:#5e5446;line-height:1.1}.rm-n{font:400 21px var(--d);text-align:center}
.ficha-img svg{display:block;width:100%;height:100%}
.bt.gr{min-height:54px;font-family:var(--d);font-weight:400;font-size:15.5px;line-height:1.05;display:flex;align-items:center;justify-content:center;gap:6px;padding:6px}
.bt.gr:disabled{opacity:.4}
.bt.rojo{background:var(--rojo);color:#fff;border-color:#7d1f25}
.bt.c-canje{background:#3f7d46;color:#fff;border-color:#27532c}
.bt.c-piz{background:#b9561f;color:#fff;border-color:#7a3510}
.bt.c-mer{background:#2f6f8f;color:#fff;border-color:#1c4a61}
.bt.c-reg{background:#5b4a8a;color:#fff;border-color:#3a2d5e}
.llama{animation:llama 1.5s ease-in-out infinite}
@keyframes llama{0%,100%{box-shadow:0 0 0 0 rgba(63,125,70,.7)}50%{box-shadow:0 0 0 6px rgba(63,125,70,0)}}
.pie{padding:10px 12px 16px;display:grid;gap:10px}
.registro{border:1.5px solid var(--linea);border-radius:8px;background:var(--crema2)}.registro summary{cursor:pointer;padding:8px 10px;font:400 13.5px var(--d);color:var(--piluso)}.registro .reg{padding:0 10px 8px}
.cuads{display:flex;justify-content:center;gap:10px}
.cuad{width:78px;height:78px;border:2.5px solid var(--tinta);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}.cuad small{font-size:10.5px;font-weight:700;line-height:1}
.c-anim{background:#ffcf3f;color:var(--tinta)}.c-anim.off{background:#cfc8b8}
.c-salir{background:var(--rojo);color:#fff;border-color:#7d1f25}
.tit-ic{display:flex;align-items:center;gap:8px}
.mc-con{display:flex;align-items:center;justify-content:center;gap:3px;flex-wrap:wrap}
.barra-va{animation:barraVa .7s ease-in-out both}
#confeti{position:fixed;inset:0;pointer-events:none;z-index:28;overflow:hidden}
#confeti i{position:absolute;top:-16px;display:block;opacity:.92;animation-name:cfCae,cfGira;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate}
@keyframes cfCae{from{transform:translate3d(0,-20px,0)}to{transform:translate3d(var(--sw),105vh,0)}}
@keyframes cfGira{from{rotate:-50deg;scale:1 1}to{rotate:50deg;scale:1 .35}}
@media (prefers-reduced-motion:reduce){#confeti{display:none}}
@keyframes barraVa{from{transform:translate(var(--dx),var(--dy))}to{transform:none}}
/* La ficha de una pieza */
.ficha{display:grid;gap:10px}
.ficha-img{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:14px;overflow:hidden;border:4px solid var(--fc);background:#cfe4ef;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ficha-img img{display:block;width:100%;height:100%}
.ficha-img .pieza-cargando{height:100%}
.ficha-num{position:absolute;right:8px;top:8px;width:50px;height:50px;border-radius:50%;background:var(--fc);color:#fff;border:3px solid #fff;box-shadow:0 0 0 2px var(--tinta);display:grid;place-items:center;font:400 28px var(--d)}
.ficha-cab{background:var(--fc);color:#fff;border-radius:10px;padding:7px 12px}.ficha-cab small{display:block;font-size:13px;opacity:.92}.ficha-cab h2{font-size:23px;line-height:1.05}
.ficha-lore{margin:0;font-style:italic;color:#5e5446;font-size:14.5px}
.ficha-filas{display:grid;gap:7px}
.ff{display:flex;gap:10px;align-items:center;background:var(--crema2);border:1.5px solid var(--linea);border-radius:10px;padding:7px 10px}
.ff-ic{flex:none;min-width:44px;display:flex;justify-content:center;align-items:center;gap:1px}
.ff>div>b{display:block;font:400 14.5px var(--d)}
.ff>div span{font-size:14.5px;line-height:1.28}
.ff-pos{font:400 15px var(--d);background:var(--tinta);color:var(--crema);border-radius:7px;padding:5px 7px}
.ff-copa{font-size:30px;color:var(--oro2);line-height:1}
.ficha-vistos{display:grid;gap:6px;background:#eef2fb;border:2px solid var(--piluso);border-radius:10px;padding:8px 10px}.ficha-vistos>b{display:flex;align-items:center;gap:7px;font:400 14.5px var(--d);color:var(--piluso)}
.ficha-quien{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:14px}.ficha-quien span{display:inline-flex;align-items:center;gap:3px}
/* Los personajes se mueven cuando se los ve grandes */
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-saludo .an-br1{animation:anSaludo 4.4s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-cejas .an-ceja{animation:anCejas 3.6s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-no .an-cab{animation:anNo 4s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-si .an-cab{animation:anSi 3.8s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-lengua .an-len{animation:anLengua 4.2s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-pisoton{animation:anPisa 3.4s ease-in infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-salto{animation:anSalto 3.8s ease-in-out infinite}
:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) .g-dibujo{animation:anDibujo 3.6s ease-in-out infinite}
@keyframes anSaludo{0%,58%,100%{transform:none}64%{transform:rotate(-13deg)}70%{transform:rotate(9deg)}76%{transform:rotate(-13deg)}82%{transform:rotate(9deg)}88%{transform:rotate(-7deg)}}
@keyframes anCejas{0%,60%,100%{transform:none}66%{transform:translateY(-6px)}72%{transform:none}78%{transform:translateY(-6px)}84%{transform:none}}
@keyframes anNo{0%,58%,100%{transform:none}64%{transform:rotate(-7deg)}70%{transform:rotate(7deg)}76%{transform:rotate(-7deg)}82%{transform:rotate(7deg)}88%{transform:none}}
@keyframes anSi{0%,60%,100%{transform:none}66%{transform:rotate(5deg) translateY(4px)}72%{transform:none}78%{transform:rotate(5deg) translateY(4px)}84%{transform:none}}
@keyframes anLengua{0%,55%,92%,100%{opacity:0;transform:translateY(-5px)}62%,85%{opacity:1;transform:none}}
@keyframes anPisa{0%,62%,100%{transform:none}70%{transform:translateY(-11px)}75%{transform:translateY(0)}78%{transform:translate(1.5px,-1.5px)}81%{transform:translate(-1.5px,0)}84%{transform:none}}
@keyframes anSalto{0%,58%,100%{transform:none}66%{transform:translateY(-15px)}72%{transform:none}78%{transform:translateY(-9px)}84%{transform:none}}
@keyframes anDibujo{0%,55%,100%{transform:none}63%{transform:rotate(-2.2deg) scale(1.03)}71%{transform:rotate(2.2deg) scale(1.03)}79%{transform:rotate(-1.4deg)}87%{transform:none}}
.tirar-bt{display:flex;align-items:center;justify-content:center;gap:10px;min-height:64px;font-size:20px}
.ult-tiro{border:1.5px dashed var(--linea);border-radius:10px;padding:8px 10px;display:grid;gap:5px;background:var(--crema2)}
.ult-tiro h4{margin:0;font:400 13px var(--d);display:flex;align-items:center;gap:4px}
.ut-fila{display:flex;align-items:center;flex-wrap:wrap;gap:5px;font-size:14px}.ut-fila>b{font-weight:700}
.ut-it{display:inline-flex;align-items:center;gap:2px;font-weight:700}.ut-it.mal{color:var(--rojo)}.ut-it.fren{color:var(--suerte)}

.camino{border:2px solid var(--piluso);border-radius:12px;padding:9px 11px;display:grid;gap:6px;background:#eef2fb}
.camino.listo{background:#fff6c9;border-color:var(--oro2);box-shadow:0 0 12px rgba(226,189,87,.9)}
.camino h4{margin:0;font:400 14px var(--d);color:var(--piluso)}
.cm-it{display:flex;gap:7px;align-items:flex-start;font-size:13.5px;line-height:1.2}.cm-it b{font-weight:700}
.cm-m{flex:none;width:18px;height:18px;border:2px solid var(--piluso);border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 12px/1 var(--t);color:#fff;background:#fff;margin-top:-1px}
.cm-it.ok .cm-m{background:var(--suerte);border-color:var(--suerte)}
.cm-pos,.cm-rec{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}.cm-pos i{font-style:normal;font-size:11.5px;padding:0 5px;border:1px solid var(--linea);border-radius:5px;color:#7b7262;background:#fff}.cm-pos i.si{background:var(--suerte);border-color:var(--suerte);color:#fff;font-weight:700}
.cm-rec .apag{opacity:.28;filter:grayscale(1)}
.circ{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;flex:none;box-shadow:0 0 0 1px rgba(0,0,0,.55)}.circ svg{display:block}
/* Reglas */
.reglas{display:grid;gap:6px;font-size:14.5px;line-height:1.35}
.reglas details{border:1.5px solid var(--linea);border-radius:8px;background:var(--crema2)}
.reglas summary{cursor:pointer;padding:9px 10px;font:400 14.5px var(--d);color:var(--piluso)}
.reglas details>div{padding:0 10px 10px}.reglas ol{margin:0;padding-left:20px;display:grid;gap:3px}
.ej{margin-top:8px;background:#fffdf6;border:1.5px dashed var(--oro2);border-radius:10px;padding:8px;display:grid;gap:5px}
.ej small{font-size:13px;line-height:1.25;color:#5e5446;text-align:center}
.ej-v{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px}
.ej-fl{font-style:normal;font-weight:700;font-size:20px;color:var(--oro2);line-height:1;padding:0 2px}
.ej-mas{font-style:normal;font-weight:700;font-size:20px;padding:0 3px}
.ej-c{display:block;width:36px;flex:none}.ej-c svg{display:block;width:100%;height:auto}.ej-c.trabada{filter:grayscale(.9) brightness(.82)}
.ej-n{font:400 26px var(--d)}
.ej-copa{width:36px;height:auto}
.ej-tacha{position:relative;display:inline-block;line-height:0}.ej-tacha::after{content:"";position:absolute;left:-3px;right:-3px;top:50%;height:5px;background:#d8261f;border-radius:3px;transform:rotate(-35deg);box-shadow:0 0 0 1.5px #fff}
.reglas ol.ej-pasos{list-style:none;padding:0;gap:6px}.ej-pasos li{display:flex;align-items:center;gap:7px}.ej-pasos li>span:last-child{flex:1;min-width:0}
.ej-calle{display:flex;align-items:center;justify-content:center}
.ej-l{width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--tinta);display:grid;place-items:center;flex:none}.ej-l.dest{background:#fff3a0;border-color:var(--oro2);box-shadow:0 0 0 3px var(--oro)}
.ej-tr{display:block;width:24px;height:6px;background:var(--linea)}
/* Fichas */
.mesa{position:relative}
.vista-tab{position:absolute;left:3px;bottom:3px;z-index:2;background:rgba(251,248,241,.94);border:1.5px solid var(--tinta);border-radius:12px;padding:2px 7px;font-size:11px;font-weight:700}
.pz-m{padding:0;color:inherit}button.pz-m{cursor:pointer}
.multa-g{display:flex;justify-content:center}
.pieza-g{display:block;width:min(300px,76vw);height:auto;margin:0 auto;border-radius:10px;background:#8fc3df}
.pieza-cargando{height:150px;display:flex;align-items:center;justify-content:center;font-weight:700}
.ficha-t{font-size:15px;line-height:1.35}.ficha-r{display:flex;gap:9px;align-items:center;margin-bottom:6px}
.cert-vista svg{display:block;width:100%;height:auto}
/* Animaciones que explican */
.fichaje.efecto,.fichaje.penal{background:rgba(16,18,34,.9)}
.efecto .fj-tit b{font-size:22px}.ef-fila{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.ef-lista{display:grid;gap:8px}
.ef-dt{display:grid;justify-items:center;gap:3px;width:82px;color:var(--crema)}.ef-dt b{font:400 12.5px/1.05 var(--d);text-align:center;overflow-wrap:anywhere}
.ef-cara{display:block;width:62px;height:62px;border-radius:50%;overflow:hidden;border:3px solid var(--oro);background:#efe7d4}.ef-cara svg{display:block;width:100%;height:100%}
.ef-mid{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:center;max-width:200px}.ef-mid>i{color:var(--oro);font-style:normal;font-size:24px;width:100%;text-align:center}
.ef-c{display:inline-block;width:42px;animation:efVuela .6s ease both}.ef-c svg{display:block;width:100%;height:auto}.ef-ben{width:96px}
@keyframes efVuela{0%{transform:translateX(-70px) rotate(-16deg) scale(.6);opacity:0}100%{transform:none;opacity:1}}
.ef-cruz{color:var(--oro);font-style:normal;font-size:34px}
.ef-roja{display:block;width:74px;height:104px;border-radius:8px;background:#d8261f;border:3px solid #fff;transform:rotate(10deg);animation:efRoja .5s cubic-bezier(.2,1.5,.4,1) both;box-shadow:0 6px 14px rgba(0,0,0,.5)}
@keyframes efRoja{0%{transform:translateY(60px) rotate(-30deg) scale(.5);opacity:0}100%{transform:rotate(10deg);opacity:1}}
.penal .pn-dado{display:flex;justify-content:center}
.pn-marco{position:relative;width:min(84vw,340px)}
.pn-cancha{display:block;width:100%;height:auto;border-radius:10px;border:3px solid #fff}
.pn-pelota{animation-duration:.8s;animation-delay:1.05s;animation-fill-mode:both;animation-timing-function:ease-in}
.pn-pelota.adentro{animation-name:pnAdentro}.pn-pelota.afuera{animation-name:pnAfuera}
@keyframes pnAdentro{0%{transform:translate(150px,155px) scale(1.5)}100%{transform:translate(212px,62px) scale(.72)}}
@keyframes pnAfuera{0%{transform:translate(150px,155px) scale(1.5)}70%{transform:translate(166px,88px) scale(.85)}100%{transform:translate(120px,150px) scale(1)}}
.pn-arq.ataja{animation:pnAtaja .4s 1.25s ease-out both}
@keyframes pnAtaja{100%{transform:translateX(14px)}}
.pn-fest{position:absolute;left:-6%;bottom:-8%;width:42%;animation:pnFest .5s 2s cubic-bezier(.2,1.5,.4,1) both;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}.pn-fest svg{display:block;width:100%;height:auto;border-radius:10px;border:3px solid var(--oro)}
@keyframes pnFest{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.pn-res{font:400 24px/1.1 var(--d);text-align:center;animation:pnFest .4s 1.9s both}.pn-res.si{color:#ffe27a}.pn-res.no{color:#fff}
/* Versión para computadora: el tablero fijo a la izquierda y todo lo demás al costado */
@media (min-width:1000px){
  #app{max-width:none;background:var(--crema)}
  .ini{width:100%;max-width:640px;margin:0 auto}
  .juego{display:grid;grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .juego.es-fin{display:block;max-width:680px;margin:0 auto}
  .es-fin .col-der{border-left:0;min-height:0}
  .barra{grid-column:1/-1;padding:8px 20px;min-height:56px}
  .col-mesa{grid-column:1;position:sticky;top:56px;height:calc(100vh - 56px);display:flex;flex-direction:column}
  .mesa{flex:1;min-height:0;justify-content:center;min-width:0}
  #tablero{height:100%;width:100%;flex:1 1 auto;min-width:0}
  .hist{width:66px;padding:12px 8px 12px 0}
  .qt{width:62px;padding:12px 0 12px 8px;gap:8px}.qt-dt{width:54px}.qt-d{grid-auto-flow:column}
  .vista-tab{left:6px;bottom:6px;font-size:12px}
  .relator{padding:29px 16px 9px;font-size:15.5px}.rel-tit{font-size:18px}.rel-t{font-size:14.5px}
  .of{max-width:620px;left:50%;right:auto;transform:translateX(-50%);width:100%}
  .col-der{grid-column:2;min-width:0;border-left:2px solid var(--tinta);min-height:calc(100vh - 56px);background:var(--crema)}
  .acc-prim{position:static;background:none}
  .modal{align-items:center}
  .hoja{border-radius:14px;max-width:560px}
  button:not(:disabled):hover{filter:brightness(1.06)}
  .cartita{transition:transform .12s ease}
  .cartita:hover{transform:translateY(-3px) scale(1.03)}
  #panel .bt.oro,#panel .bt.fuerte{cursor:pointer}
}

@media (prefers-reduced-motion:reduce){:is(.hoja,.fichaje,.mu-eq,.dtelige,.hero,.tuto-extra,.mp,.inf-l) :is(.an-br1,.an-ceja,.an-cab,.an-len,.fig){animation:none!important}.llama,.barra-va{animation:none}.reloj.urgente{animation:none}
.lat,.rueda,.fj-gira,.fj-pone,.mu-rayos,.mu-est,.copa,.mu-carta,.cj-tk{animation:none}.tq-c.ida,.tq-c.vuelta{animation-duration:.01s}}
/* v36: el inicio entra entero en la pantalla, sin bajar */
.ini-com{gap:6px;padding:6px 12px 10px}.ed-nom{padding-right:44px!important;padding-left:44px!important}
.ini-cab{display:flex;align-items:center;justify-content:center;gap:10px}
.ini-com .logo{width:54px;margin:0}.ini-com h1{margin:0;font-size:28px;text-align:left}.ini-com h1 small{font-size:12px}
.ini-com .hero{padding:10px 10px 10px;gap:8px}.ini-com .hero h2{font-size:clamp(16px,4.6vw,20px)}
.ini-com .hp-vis{transform:scale(.52);margin:-20px 0}
.ini-com .caja,.ini-com .ini-panel{grid-template-columns:minmax(0,1fr)}
.ini-com .ini-tabs span{display:none}.ini-com .dtelige{min-height:0}
.dt-lin{display:flex;align-items:center;gap:6px}.dt-lin b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dt-quien{flex:none;min-height:30px;padding:3px 10px;border:2px solid var(--tinta);border-radius:16px;background:#fff;color:var(--tinta);font:700 12.5px var(--t);cursor:pointer}.dt-quien.per{background:var(--piluso);color:var(--crema)}
.dt-cuenta{font:700 13px var(--t);color:#5e5446;margin-left:4px}
.ini-com .hero-pasos li{padding:5px 4px}.ini-com .hero-pasos li::before{width:16px;height:16px;font-size:11px;line-height:16px;left:3px;top:3px}
.ini-com .hero-pasos b{font-size:12px}.ini-com .hero-pasos li>span{display:none}.ini-com .hero h2{font-size:clamp(15px,4.3vw,19px)}.ini-com .ini-tabs button{padding:5px 4px}
.ini-com .hero-dato{font-size:12px;margin-top:-2px}
.ini-com .hero-bts .bt{min-height:38px;padding:6px 8px}
.ini-com .ini-tabs button{padding:6px 4px}.ini-com .ini-tabs b{font-size:15px}.ini-com .ini-tabs span{font-size:11.5px}
.ini-com .ini-panel{padding:9px;gap:8px}
.ini-com .bt-op{padding:6px 9px}.ini-com .bt-op span{display:none}
.ini-com .caja{padding:7px 8px;gap:5px}.ini-com .caja h3{font-size:15px}
.ini-com .dtelige{padding:3px 6px;gap:7px}.ini-com .dt-tog{width:42px;height:42px}.ini-com .dt-lapiz{width:23px;height:23px;padding:3px;right:-8px;top:-6px}
.ini-com .dt-add{width:31px;height:31px;font-size:19px}
.ini-com .dt-dat{gap:3px}.ini-com .seg button{min-height:28px;font-size:12px}
.ini-com #empezar{min-height:42px}
/* Ronda 37: el inicio ocupa justo la pantalla, sin que sobre ni falte, sobre azul Piluso */
#app:has(.ini-com){background:radial-gradient(circle at 50% 0,#34498c,#22305a 58%,#19234a)}
.ini-com{min-height:100vh;min-height:100dvh;box-sizing:border-box;display:flex;flex-direction:column;gap:6px;padding:6px 12px 8px}
.ini-com>*{flex:none}
.ini-com .ini-panel{flex:1 1 auto;align-content:space-evenly;border-color:var(--oro);background:var(--crema)}
.ini-com h1{color:var(--crema)}.ini-com h1 small{color:var(--oro)}
.ini-com .logo{width:46px}.ini-com h1{font-size:26px}
.ini-com .hero{background:rgba(255,255,255,.07);box-shadow:none;border:1.5px solid rgba(226,189,87,.55);padding:8px 9px 9px;gap:6px}
.ini-com .hero-pasos{margin:0}.ini-com .hp-vis{transform:scale(.44);margin:-28px 0 -27px}
.ini-com .ini-tabs button{background:#3a4c86;color:var(--crema);border-color:var(--oro)}
.ini-com .ini-tabs button[aria-selected=true]{background:var(--oro);color:var(--tinta);border-color:var(--oro)}
